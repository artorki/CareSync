<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>CareSync Pro | پلتفرم هوشمند مدیریت و هماهنگی مراقبت بیمار (سلامت خانواده)</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0d9488" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Vazirmatn', 'Tahoma', 'sans-serif']
          },
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a'
            }
          }
        }
      }
    };
  </script>
  <style>
    * {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }
    body {
      line-height: 1.75;
      letter-spacing: -0.01em;
    }
    details > summary {
      list-style: none;
    }
    details > summary::-webkit-details-marker {
      display: none;
    }
    /* حالت خوانایی بالا ویژه سالمندان (Senior Accessibility Mode) */
    html.senior-mode {
      font-size: 19px !important;
    }
    html.senior-mode button,
    html.senior-mode select,
    html.senior-mode input,
    html.senior-mode textarea {
      min-height: 52px !important;
      font-weight: 700 !important;
      border-width: 2px !important;
    }
    html.senior-mode .senior-boost {
      font-size: 1.15rem !important;
      line-height: 1.85 !important;
    }
    /* اسکلتون شیمر استاندارد بخش ۴.۳ */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton-shimmer {
      background: linear-gradient(90deg, #e2e8f0 25%, #f8fafc 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    .dark .skeleton-shimmer {
      background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
      background-size: 200% 100%;
    }
    /* پالس دکمه اورژانس SOS */
    @keyframes sosPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
      50% { box-shadow: 0 0 0 12px rgba(220, 38, 38, 0); }
    }
    .sos-pulse {
      animation: sosPulse 2s infinite;
    }
    /* استایل چاپ گزارش رسمی پزشک (Clinical Handover PDF) */
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: #fff !important; color: #000 !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- بنر هشدار اورژانسی فعال (در صورت وجود SOS باز یا علائم بحرانی) -->
  <div id="globalCriticalBanner" class="hidden bg-red-600 text-white px-4 py-3 shadow-lg z-50 no-print">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center justify-center w-9 h-9 rounded-full bg-white text-red-600 font-black text-lg animate-bounce">!</span>
        <div>
          <p id="globalCriticalTitle" class="font-extrabold text-base md:text-lg">وضعیت اورژانسی فعال است!</p>
          <p id="globalCriticalSubtitle" class="text-xs md:text-sm text-red-100"></p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnBannerAckSos" type="button" class="px-4 py-2 rounded-xl bg-white text-red-700 font-bold text-sm hover:bg-red-50 shadow">
          ✅ متوجه شدم / در راهم
        </button>
        <button id="btnBannerResolveSos" type="button" class="px-4 py-2 rounded-xl bg-red-800 text-white font-bold text-sm hover:bg-red-900 border border-red-400">
          پایان وضعیت اورژانسی
        </button>
      </div>
    </div>
  </div>

  <!-- ۱. نوار بالایی تک‌خطی، خلوت و بسیار ساده -->
  <header class="sticky top-0 z-40 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between gap-3">
      <!-- سمت راست: لوگو + انتخاب بیمار -->
      <div class="flex items-center gap-3 min-w-0">
        <div class="flex items-center gap-2.5 shrink-0">
          <div class="w-11 h-11 rounded-2xl bg-teal-600 flex items-center justify-center text-white font-black text-lg shadow-sm">
            +C
          </div>
          <div class="hidden sm:block text-right">
            <span class="font-black text-base text-slate-900 dark:text-white block leading-tight">همیار سلامت خانواده</span>
            <span class="text-xs text-slate-500 dark:text-slate-400 block">مدیریت مراقبت بیمار در منزل</span>
          </div>
        </div>

        <!-- انتخابگر پرونده بیمار -->
        <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-800 px-3 py-2 rounded-2xl border border-slate-200 dark:border-slate-700 min-w-0">
          <label for="patientSelect" class="text-xs font-bold text-slate-500 dark:text-slate-400 hidden md:inline shrink-0">بیمار:</label>
          <select id="patientSelect" aria-label="انتخاب پرونده بیمار" class="bg-transparent text-sm font-extrabold text-slate-900 dark:text-slate-100 focus:outline-none cursor-pointer truncate max-w-[180px] sm:max-w-[240px]"></select>
          <button id="btnOpenNewPatientModal" type="button" title="افزودن پرونده بیمار جدید" class="w-7 h-7 rounded-xl bg-teal-600 text-white font-bold text-sm hover:bg-teal-700 flex items-center justify-center shrink-0">+</button>
        </div>

        <div id="topbarHealthBadge" class="hidden xl:inline-flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs font-extrabold border whitespace-nowrap shrink-0"></div>
      </div>

      <!-- سمت چپ: فقط دکمه‌های اصلی روزمره -->
      <div class="flex items-center gap-2 shrink-0">
        <button id="btnToggleSeniorMode" type="button" class="px-3 py-2 rounded-2xl border-2 border-amber-400 bg-amber-50 dark:bg-amber-950/60 text-amber-950 dark:text-amber-200 text-xs font-extrabold hover:bg-amber-100 transition flex items-center gap-1.5 whitespace-nowrap" title="بزرگ‌نمایی فونت و دکمه‌ها ویژه سالمندان">
          <span>👓</span>
          <span id="seniorModeLabel" class="hidden sm:inline">حالت سالمندان: خاموش</span>
        </button>

        <button id="btnOpenNotificationsModal" type="button" class="relative p-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 transition shrink-0" title="اعلان‌ها">
          <span class="text-base">🔔</span>
          <span id="notifBadgeCount" class="hidden absolute -top-1 -right-1 min-w-[20px] h-5 px-1 rounded-full bg-rose-600 text-white text-[11px] font-black items-center justify-center">0</span>
        </button>

        <button id="btnToggleSettingsBar" type="button" data-action="toggleSettingsDrawer" class="p-2.5 sm:px-3.5 sm:py-2 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200 text-xs font-extrabold flex items-center gap-1.5 whitespace-nowrap shrink-0" title="تنظیمات، تغییر کاربر و اتصال سرور">
          <span>⚙️</span>
          <span class="hidden md:inline">تنظیمات</span>
        </button>

        <button id="btnOpenSosModal" type="button" class="sos-pulse px-3.5 sm:px-4 py-2.5 rounded-2xl bg-red-600 hover:bg-red-700 active:scale-95 text-white font-black text-xs sm:text-sm flex items-center gap-1.5 shadow-md transition whitespace-nowrap shrink-0">
          <span>🚨</span>
          <span>اورژانس SOS</span>
        </button>
      </div>
    </div>

    <!-- پنل تنظیمات (به صورت پیش‌فرض کاملاً مخفی است و فقط با کلیک روی دکمه ⚙️ تنظیمات باز می‌شود) -->
    <div id="settingsTopDrawer" class="hidden border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/95">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3 text-xs">
        <div class="flex flex-wrap items-center gap-2">
          <div class="flex items-center gap-1.5 bg-white dark:bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700">
            <span class="text-slate-500 font-bold">کاربر فعال:</span>
            <select id="activeUserSelect" aria-label="انتخاب کاربر و نقش فعال" class="bg-transparent text-xs font-extrabold text-slate-800 dark:text-slate-100 focus:outline-none cursor-pointer"></select>
            <button id="btnOpenOtpLoginModal" type="button" class="text-[11px] px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-teal-600 hover:text-white font-bold transition">ورود OTP</button>
          </div>

          <button id="btnOpenHandoverPdfModal" type="button" class="px-3 py-1.5 rounded-xl bg-slate-800 text-white dark:bg-slate-200 dark:text-slate-900 font-bold hover:opacity-90">
            📄 گزارش رسمی پزشک (PDF)
          </button>

          <button id="btnOpenGasModal" type="button" class="px-3 py-1.5 rounded-xl border border-teal-300 dark:border-teal-700 bg-teal-50 dark:bg-teal-950/50 text-teal-800 dark:text-teal-200 font-bold hover:bg-teal-100 flex items-center gap-1.5">
            <span id="gasStatusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
            <span id="gasStatusText">اتصال GAS و دانلود کدها</span>
          </button>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <span id="currentRolePill" class="px-2.5 py-1 rounded-lg font-bold text-[11px] bg-blue-100 text-blue-800 dark:bg-blue-900/50 dark:text-blue-200"></span>
          <span id="topbarActiveShift" class="hidden"></span>
          <span id="currentPermissionsSummary" class="hidden"></span>
          <button id="btnToggleDarkMode" type="button" aria-label="تغییر حالت شب و روز" class="px-2.5 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold hover:bg-slate-100">
            🌙
          </button>
          <button id="btnToggleOfflineSim" type="button" class="px-2.5 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-[11px] font-bold hover:border-amber-500">
            📶 آنلاین (شبیه‌سازی قطعی اینترنت)
          </button>
          <button id="btnTriggerSkeletonDemo" type="button" class="px-2.5 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-[11px] font-bold hover:border-teal-500">
            ⏳ تست Skeleton Loading
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- چیدمان اصلی: سایدبار دسکتاپ منظم + محتوای اصلی + نوار پایین موبایل -->
  <div class="flex-1 max-w-7xl w-full mx-auto flex flex-col lg:flex-row gap-6 px-4 sm:px-6 py-6 pb-28 lg:pb-12 no-print">

    <!-- نوار افقی اسکرول‌پذیر ویژه موبایل و تبلت -->
    <div class="lg:hidden flex items-center gap-2 overflow-x-auto pb-2 -mx-1 px-1">
      <button type="button" data-nav="dashboard" class="nav-tab-btn shrink-0 px-4 py-2.5 rounded-2xl text-xs font-extrabold whitespace-nowrap">🏥 خلاصه امروز</button>
      <button type="button" data-nav="medications-inventory" class="nav-tab-btn shrink-0 px-4 py-2.5 rounded-2xl text-xs font-extrabold whitespace-nowrap">💊 داروها</button>
      <button type="button" data-nav="vitals" class="nav-tab-btn shrink-0 px-4 py-2.5 rounded-2xl text-xs font-extrabold whitespace-nowrap">❤️ علائم حیاتی</button>
      <button type="button" data-nav="shifts" class="nav-tab-btn shrink-0 px-4 py-2.5 rounded-2xl text-xs font-extrabold whitespace-nowrap">📅 شیفت‌ها</button>
      <button type="button" data-nav="appointments" class="nav-tab-btn shrink-0 px-4 py-2.5 rounded-2xl text-xs font-extrabold whitespace-nowrap">🚑 نوبت دکتر</button>
      <button type="button" data-nav="medical-orders" class="nav-tab-btn shrink-0 px-4 py-2.5 rounded-2xl text-xs font-extrabold whitespace-nowrap">🧪 آزمایش‌ها</button>
      <button type="button" data-nav="finance-documents" class="nav-tab-btn shrink-0 px-4 py-2.5 rounded-2xl text-xs font-extrabold whitespace-nowrap">📁 مدارک و مالی</button>
      <button type="button" data-nav="care-circle" class="nav-tab-btn shrink-0 px-4 py-2.5 rounded-2xl text-xs font-extrabold whitespace-nowrap">👥 اعضای خانواده</button>
    </div>

    <!-- سایدبار ناوبری دسکتاپ با عرض کافی و بج‌های دایره‌ای استاندارد بدون شکستگی خط -->
    <aside class="hidden lg:block lg:w-72 shrink-0">
      <nav aria-label="منوی اصلی بخش‌های مراقبت" class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-3.5 shadow-sm sticky top-24">
        <div class="px-3 py-2 mb-2 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
          <span class="text-xs font-extrabold text-slate-500 dark:text-slate-400">بخش‌های مراقبت</span>
          <span id="subscriptionBadge" class="text-[11px] px-2.5 py-0.5 rounded-full bg-teal-50 text-teal-700 dark:bg-teal-950 dark:text-teal-300 font-bold whitespace-nowrap">نسخه کامل</span>
        </div>

        <ul id="sidebarNavList" class="space-y-1.5">
          <li>
            <button type="button" data-nav="dashboard" class="nav-tab-btn w-full flex items-center justify-between gap-2 px-3.5 py-3 rounded-2xl text-right font-bold text-sm transition">
              <span class="flex items-center gap-2.5 whitespace-nowrap"><span>🏥</span><span>خلاصه وضعیت امروز</span></span>
              <span id="navBadgeDashboard" class="hidden min-w-[24px] h-6 px-2 text-xs rounded-full bg-rose-100 text-rose-700 font-extrabold items-center justify-center shrink-0 whitespace-nowrap"></span>
            </button>
          </li>
          <li>
            <button type="button" data-nav="medications-inventory" class="nav-tab-btn w-full flex items-center justify-between gap-2 px-3.5 py-3 rounded-2xl text-right font-bold text-sm transition">
              <span class="flex items-center gap-2.5 whitespace-nowrap"><span>💊</span><span>داروها و موجودی</span></span>
              <span id="navBadgeInventory" class="hidden min-w-[24px] h-6 px-2 text-xs rounded-full bg-rose-100 text-rose-700 font-extrabold items-center justify-center shrink-0 whitespace-nowrap">0</span>
            </button>
          </li>
          <li>
            <button type="button" data-nav="vitals" class="nav-tab-btn w-full flex items-center justify-between gap-2 px-3.5 py-3 rounded-2xl text-right font-bold text-sm transition">
              <span class="flex items-center gap-2.5 whitespace-nowrap"><span>❤️</span><span>علائم حیاتی (فشار و قند)</span></span>
              <span id="navBadgeVitals" class="hidden min-w-[24px] h-6 px-2 text-xs rounded-full bg-teal-100 text-teal-800 font-extrabold items-center justify-center shrink-0 whitespace-nowrap">0</span>
            </button>
          </li>
          <li>
            <button type="button" data-nav="shifts" class="nav-tab-btn w-full flex items-center justify-between gap-2 px-3.5 py-3 rounded-2xl text-right font-bold text-sm transition">
              <span class="flex items-center gap-2.5 whitespace-nowrap"><span>📅</span><span>نوبت شیفت مراقبت</span></span>
              <span id="navBadgeShifts" class="hidden min-w-[24px] h-6 px-2 text-xs rounded-full bg-purple-100 text-purple-800 font-extrabold items-center justify-center shrink-0 whitespace-nowrap">0</span>
            </button>
          </li>
          <li>
            <button type="button" data-nav="appointments" class="nav-tab-btn w-full flex items-center justify-between gap-2 px-3.5 py-3 rounded-2xl text-right font-bold text-sm transition">
              <span class="flex items-center gap-2.5 whitespace-nowrap"><span>🚑</span><span>نوبت دکتر و ویزیت</span></span>
              <span id="navBadgeAppointments" class="hidden min-w-[24px] h-6 px-2 text-xs rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-extrabold items-center justify-center shrink-0 whitespace-nowrap">0</span>
            </button>
          </li>
          <li>
            <button type="button" data-nav="medical-orders" class="nav-tab-btn w-full flex items-center justify-between gap-2 px-3.5 py-3 rounded-2xl text-right font-bold text-sm transition">
              <span class="flex items-center gap-2.5 whitespace-nowrap"><span>🧪</span><span>نسخه‌ها و آزمایش‌ها</span></span>
              <span id="navBadgeOrders" class="hidden min-w-[24px] h-6 px-2 text-xs rounded-full bg-amber-100 text-amber-800 font-extrabold items-center justify-center shrink-0 whitespace-nowrap">0</span>
            </button>
          </li>
          <li>
            <button type="button" data-nav="finance-documents" class="nav-tab-btn w-full flex items-center justify-between gap-2 px-3.5 py-3 rounded-2xl text-right font-bold text-sm transition">
              <span class="flex items-center gap-2.5 whitespace-nowrap"><span>📁</span><span>مدارک پزشکی و هزینه‌ها</span></span>
              <span id="navBadgeFinance" class="hidden min-w-[24px] h-6 px-2 text-xs rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-extrabold items-center justify-center shrink-0 whitespace-nowrap">0</span>
            </button>
          </li>
          <li>
            <button type="button" data-nav="care-circle" class="nav-tab-btn w-full flex items-center justify-between gap-2 px-3.5 py-3 rounded-2xl text-right font-bold text-sm transition">
              <span class="flex items-center gap-2.5 whitespace-nowrap"><span>👥</span><span>اعضای خانواده و دسترسی</span></span>
              <span id="navBadgeMembers" class="hidden min-w-[24px] h-6 px-2 text-xs rounded-full bg-blue-100 text-blue-800 font-extrabold items-center justify-center shrink-0 whitespace-nowrap">0</span>
            </button>
          </li>
        </ul>

        <div id="offlineQueueIndicator" class="hidden mt-3 p-2.5 rounded-xl bg-amber-100 text-amber-900 text-xs font-bold"></div>
      </nav>
    </aside>

    <!-- بخش اصلی نمایش صفحه فعال -->
    <main class="flex-1 min-w-0">
      <div id="mainSkeletonContainer" class="hidden space-y-4">
        <div class="h-36 rounded-2xl skeleton-shimmer"></div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="h-44 rounded-2xl skeleton-shimmer"></div>
          <div class="h-44 rounded-2xl skeleton-shimmer"></div>
          <div class="h-44 rounded-2xl skeleton-shimmer"></div>
        </div>
      </div>

      <div id="mainErrorContainer" class="hidden mb-4 p-4 rounded-2xl bg-red-50 dark:bg-red-950/50 border-2 border-red-300 dark:border-red-800 text-red-900 dark:text-red-200 flex items-center justify-between gap-3">
        <div>
          <p class="font-extrabold text-sm" id="mainErrorTitle">خطا در ارتباط با شبکه</p>
          <p class="text-xs mt-0.5" id="mainErrorDesc"></p>
        </div>
        <button id="btnRetryErrorState" type="button" class="px-4 py-2 rounded-xl bg-red-600 text-white text-xs font-bold hover:bg-red-700 shrink-0">
          🔄 تلاش مجدد
        </button>
      </div>

      <div id="viewContainer" class="space-y-6"></div>
    </main>
  </div>

  <!-- نوار ناوبری پایین موبایل -->
  <nav aria-label="ناوبری سریع موبایل" class="lg:hidden fixed bottom-0 inset-x-0 z-40 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 shadow-lg px-2 py-1.5 flex items-center justify-around no-print">
    <button type="button" data-nav="dashboard" class="mobile-nav-btn flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-[11px] font-bold">
      <span class="text-lg">🏥</span><span>داشبورد</span>
    </button>
    <button type="button" data-nav="medications-inventory" class="mobile-nav-btn flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-[11px] font-bold">
      <span class="text-lg">💊</span><span>داروخانه</span>
    </button>
    <button type="button" data-nav="vitals" class="mobile-nav-btn flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-[11px] font-bold">
      <span class="text-lg">❤️</span><span>علائم حیاتی</span>
    </button>
    <button type="button" data-nav="shifts" class="mobile-nav-btn flex flex-col items-center gap-0.5 px-2 py-1 rounded-xl text-[11px] font-bold">
      <span class="text-lg">📅</span><span>شیفت‌ها</span>
    </button>

  <script>
    /* ============================================================================
     * CareSync Pro — Frontend Application & Dual-Mode State Engine (GitHub Pages + GAS)
     * ============================================================================ */

    const EMBEDDED_PROJECT_FILES = {"Code.gs": "/**\n * ============================================================================\n * CareSync Pro (همیار سلامت خانواده) — Google Apps Script Production Backend\n * ============================================================================\n * معماری کامل بک‌اند منطبق بر سند جامع محصول و معماری فنی (۲۵ صفحه‌ای)\n * قابل اجرا روی Google Apps Script و متصل به Google Sheets (۱۶ جدول + لاگ حسابرسی)\n * و Google Drive (مخزن امن اسناد پزشکی و فاکتورهای مالی)\n * ============================================================================\n */\n\nconst APP_VERSION = '2.4.0-production';\n\n/**\n * تعریف دقیق ۱۶ جدول استاندارد سند + جدول لاگ حسابرسی تغییرناپذیر (Immutable Audit Trail)\n */\nconst DB_SCHEMA = {\n  users: [\n    'id', 'full_name', 'phone_number', 'email', 'password_hash',\n    'telegram_chat_id', 'telegram_username', 'avatar_url',\n    'system_role', 'is_active', 'last_login_at', 'created_at', 'updated_at'\n  ],\n  patients: [\n    'id', 'owner_user_id', 'full_name', 'national_code', 'birth_date',\n    'gender', 'blood_type', 'height_cm', 'weight_kg',\n    'chronic_conditions', 'allergies', 'insurance_basic',\n    'insurance_supplementary', 'preferred_hospital', 'home_address',\n    'emergency_notes', 'current_health_status', 'current_health_score',\n    'current_mobility_status', 'current_consciousness',\n    'current_clinical_summary', 'last_examined_at', 'vital_thresholds',\n    'subscription_tier', 'created_at', 'updated_at', 'deleted_at'\n  ],\n  care_circle_members: [\n    'id', 'patient_id', 'user_id', 'relationship_title', 'role',\n    'permissions', 'receive_sms_alerts', 'receive_telegram_alerts',\n    'color_code', 'joined_at'\n  ],\n  doctor_appointments: [\n    'id', 'patient_id', 'created_by_user_id', 'doctor_name', 'specialty',\n    'clinic_name_and_address', 'clinic_phone', 'appointment_datetime',\n    'visit_reason', 'requires_patient_presence', 'transport_method',\n    'vehicle_owner_or_details', 'departure_datetime',\n    'required_equipment_checklist', 'logistics_instructions',\n    'status', 'created_at', 'updated_at', 'deleted_at'\n  ],\n  appointment_escorts: [\n    'id', 'appointment_id', 'member_user_id', 'escort_role',\n    'confirmation_status', 'notes'\n  ],\n  clinical_assessments: [\n    'id', 'patient_id', 'appointment_id', 'recorded_by_user_id',\n    'doctor_name', 'examination_date', 'health_status', 'health_score',\n    'mobility_status', 'consciousness_level', 'active_problems_diagnosis',\n    'doctor_recommendations', 'next_visit_suggested_date', 'created_at'\n  ],\n  medical_orders: [\n    'id', 'patient_id', 'assessment_id', 'order_type', 'title',\n    'description_and_prep', 'prescribing_doctor', 'priority', 'status',\n    'scheduled_datetime', 'due_date', 'completed_at',\n    'requires_patient_presence', 'location_type',\n    'center_name_and_address', 'assigned_to_user_id', 'transport_notes',\n    'result_summary', 'created_at', 'updated_at', 'deleted_at'\n  ],\n  inventory_items: [\n    'id', 'patient_id', 'item_category', 'name', 'dosage_or_spec',\n    'schedule_times', 'usage_instructions', 'unit',\n    'current_stock_quantity', 'daily_consumption_rate',\n    'low_stock_threshold_days', 'low_stock_threshold_quantity',\n    'stock_status', 'designated_purchaser_user_id', 'is_active',\n    'last_purchased_at', 'estimated_depletion_date',\n    'created_at', 'updated_at', 'deleted_at'\n  ],\n  medication_consumption_logs: [\n    'id', 'inventory_item_id', 'patient_id', 'administered_by_user_id',\n    'scheduled_for', 'taken_at', 'status', 'quantity_used', 'notes'\n  ],\n  procurement_orders: [\n    'id', 'patient_id', 'inventory_item_id', 'assigned_purchaser_user_id',\n    'status', 'urgency', 'requested_quantity', 'purchased_quantity',\n    'total_cost_amount', 'financial_record_id', 'alert_sent_at',\n    'purchased_at', 'created_at', 'updated_at'\n  ],\n  vital_sign_logs: [\n    'id', 'patient_id', 'recorded_by_user_id', 'measured_at',\n    'systolic_bp', ' diastolic_bp', 'heart_rate', 'spo2',\n    'blood_glucose', 'glucose_context', 'body_temperature',\n    'respiratory_rate', 'pain_level', 'abnormality_status',\n    'clinical_notes', 'created_at'\n  ].map(c => c.trim()),\n  emergency_alerts: [\n    'id', 'patient_id', 'triggered_by_user_id', 'severity',\n    'reason_title', 'details', 'destination_hospital', 'snapshot_vitals',\n    'status', 'acknowledged_by_users', 'sms_delivery_report',\n    'telegram_delivery_report', 'triggered_at', 'resolved_at'\n  ],\n  care_shifts: [\n    'id', 'patient_id', 'assigned_user_id', 'original_user_id',\n    'shift_title', 'start_datetime', 'end_datetime', 'recurrence_rule_id',\n    'status', 'handover_notes', 'handover_checklist',\n    'checked_in_at', 'checked_out_at', 'created_at', 'updated_at'\n  ],\n  shift_change_requests: [\n    'id', 'patient_id', 'request_type', 'source_shift_id',\n    'requester_user_id', 'target_shift_id', 'target_user_id',\n    'reason', 'status', 'responded_at', 'created_at', 'updated_at'\n  ],\n  medical_documents: [\n    'id', 'patient_id', 'uploaded_by_user_id', 'related_assessment_id',\n    'related_order_id', 'category', 'title', 'document_actual_date',\n    'file_storage_key', 'file_name', 'file_mime_type', 'file_size_bytes',\n    'description_tags', 'created_at', 'deleted_at'\n  ],\n  financial_invoices: [\n    'id', 'patient_id', 'recorded_by_user_id', 'paid_by_user_id',\n    'expense_category', 'title', 'amount', 'currency', 'invoice_date',\n    'receipt_file_storage_key', 'receipt_file_name',\n    'insurance_claim_status', 'reimbursed_amount', 'notes',\n    'created_at', 'updated_at', 'deleted_at'\n  ],\n  audit_logs: [\n    'id', 'patient_id', 'actor_user_id', 'actor_name', 'actor_role',\n    'action_type', 'entity_table', 'entity_id', 'summary',\n    'payload_json', 'ip_or_client', 'created_at'\n  ]\n};\n\n/**\n * ماتریس دسترسی پیش‌فرض بر اساس نقش (بخش ۲.۲ سند)\n */\nconst DEFAULT_ROLE_PERMISSIONS = {\n  CARE_ADMIN: {\n    canManageAppointments: true,\n    canManageMeds: true,\n    canLogVitals: true,\n    canManageShifts: true,\n    canViewFinance: true,\n    canUploadDocs: true,\n    isDefaultPurchaser: false\n  },\n  FAMILY_MEMBER: {\n    canManageAppointments: true,\n    canManageMeds: true,\n    canLogVitals: true,\n    canManageShifts: false,\n    canViewFinance: true,\n    canUploadDocs: true,\n    isDefaultPurchaser: false\n  },\n  NURSE: {\n    canManageAppointments: false,\n    canManageMeds: false,\n    canLogVitals: true,\n    canManageShifts: false,\n    canViewFinance: false,\n    canUploadDocs: false,\n    isDefaultPurchaser: false\n  },\n  PROCUREMENT_AGENT: {\n    canManageAppointments: false,\n    canManageMeds: true,\n    canLogVitals: true,\n    canManageShifts: false,\n    canViewFinance: true,\n    canUploadDocs: true,\n    isDefaultPurchaser: true\n  },\n  VIEWER_DOCTOR: {\n    canManageAppointments: false,\n    canManageMeds: false,\n    canLogVitals: false,\n    canManageShifts: false,\n    canViewFinance: false,\n    canUploadDocs: false,\n    isDefaultPurchaser: false\n  }\n};\n\n/* ============================================================================\n * ۱. نقاط ورود وب‌اپلیکیشن (HTTP GET / POST Entrypoints)\n * ============================================================================ */\n\nfunction doGet(e) {\n  try {\n    const params = (e && e.parameter) ? e.parameter : {};\n    const action = params.action || 'health';\n\n    if (action === 'health') {\n      return jsonResponse(200, getSystemHealth());\n    }\n\n    if (action === 'bootstrap') {\n      const patientId = params.patientId || null;\n      const userId = params.userId || 'user-admin';\n      return jsonResponse(200, getBootstrapPayload(patientId, userId));\n    }\n\n    if (action === 'vitalsAnalytics') {\n      const patientId = params.patientId;\n      const days = parseInt(params.days || '30', 10);\n      return jsonResponse(200, getVitalsAnalytics(patientId, days));\n    }\n\n    if (action === 'invoicesSummary') {\n      const patientId = params.patientId;\n      return jsonResponse(200, getFinancialSummary(patientId));\n    }\n\n    return jsonResponse(400, { error: 'مسیر GET نامعتبر است.', action: action });\n  } catch (err) {\n    return handleException(err);\n  }\n}\n\nfunction doPost(e) {\n  try {\n    let body = {};\n    if (e && e.postData && e.postData.contents) {\n      body = JSON.parse(e.postData.contents);\n    }\n    const action = body.action || (e && e.parameter && e.parameter.action) || '';\n    const userId = body.userId || 'user-admin';\n    const patientId = body.patientId || 'default-patient';\n\n    switch (action) {\n      case 'setupDatabase':\n        return jsonResponse(200, setupDatabase(Boolean(body.seedDemo)));\n\n      case 'requestOtp':\n        return jsonResponse(200, handleRequestOtp(body));\n\n      case 'verifyOtp':\n        return jsonResponse(200, handleVerifyOtp(body));\n\n      case 'createPatient':\n        return jsonResponse(201, createPatientProfile(userId, body.payload));\n\n      case 'addCareCircleMember':\n        assertAccess(patientId, userId, ['CARE_ADMIN']);\n        return jsonResponse(201, addCareCircleMember(patientId, userId, body.payload));\n\n      case 'updateMemberPermissions':\n        assertAccess(patientId, userId, ['CARE_ADMIN']);\n        return jsonResponse(200, updateMemberPermissions(patientId, userId, body.payload));\n\n      case 'createAppointment':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER'], 'canManageAppointments');\n        return jsonResponse(201, createDoctorAppointment(patientId, userId, body.payload));\n\n      case 'updateAppointmentStatus':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER', 'NURSE']);\n        return jsonResponse(200, updateAppointmentStatus(patientId, userId, body.payload));\n\n      case 'respondEscort':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER', 'NURSE']);\n        return jsonResponse(200, respondAppointmentEscort(patientId, userId, body.payload));\n\n      case 'createClinicalAssessment':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER', 'NURSE', 'VIEWER_DOCTOR']);\n        return jsonResponse(201, createClinicalAssessment(patientId, userId, body.payload));\n\n      case 'createMedicalOrder':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER', 'VIEWER_DOCTOR']);\n        return jsonResponse(201, createMedicalOrder(patientId, userId, body.payload));\n\n      case 'updateMedicalOrderStatus':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER', 'NURSE', 'VIEWER_DOCTOR']);\n        return jsonResponse(200, updateMedicalOrderStatus(patientId, userId, body.payload));\n\n      case 'createInventoryItem':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER', 'PROCUREMENT_AGENT'], 'canManageMeds');\n        return jsonResponse(201, createInventoryItem(patientId, userId, body.payload));\n\n      case 'updateInventoryRate':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER', 'VIEWER_DOCTOR'], 'canManageMeds');\n        return jsonResponse(200, updateInventoryDailyRate(patientId, userId, body.payload));\n\n      case 'consumeInventoryItem':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER', 'NURSE', 'PROCUREMENT_AGENT']);\n        return jsonResponse(200, consumeInventoryItem(patientId, userId, body.payload));\n\n      case 'restockInventoryItem':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER', 'PROCUREMENT_AGENT']);\n        return jsonResponse(200, restockInventoryItem(patientId, userId, body.payload));\n\n      case 'logVitalSigns':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER', 'NURSE'], 'canLogVitals');\n        return jsonResponse(201, logVitalSigns(patientId, userId, body.payload));\n\n      case 'generateShiftSchedule':\n        assertAccess(patientId, userId, ['CARE_ADMIN'], 'canManageShifts');\n        return jsonResponse(201, generateShiftSchedule(patientId, userId, body.payload));\n\n      case 'requestShiftReplacement':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER', 'NURSE']);\n        return jsonResponse(201, requestShiftReplacement(patientId, userId, body.payload));\n\n      case 'claimShiftReplacement':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER', 'NURSE']);\n        return jsonResponse(200, claimShiftReplacementWithLock(patientId, userId, body.payload));\n\n      case 'requestMutualSwap':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER', 'NURSE']);\n        return jsonResponse(201, requestMutualSwap(patientId, userId, body.payload));\n\n      case 'respondMutualSwap':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER', 'NURSE']);\n        return jsonResponse(200, respondMutualSwapWithLock(patientId, userId, body.payload));\n\n      case 'submitShiftHandover':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER', 'NURSE']);\n        return jsonResponse(200, submitShiftHandover(patientId, userId, body.payload));\n\n      case 'triggerEmergencySos':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER', 'NURSE', 'PROCUREMENT_AGENT']);\n        return jsonResponse(201, triggerEmergencySos(patientId, userId, body.payload));\n\n      case 'acknowledgeEmergencySos':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER', 'NURSE', 'PROCUREMENT_AGENT', 'VIEWER_DOCTOR']);\n        return jsonResponse(200, acknowledgeEmergencySos(patientId, userId, body.payload));\n\n      case 'resolveEmergencySos':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER']);\n        return jsonResponse(200, resolveEmergencySos(patientId, userId, body.payload));\n\n      case 'uploadMedicalDocument':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER', 'NURSE', 'VIEWER_DOCTOR']);\n        return jsonResponse(201, uploadMedicalDocument(patientId, userId, body.payload));\n\n      case 'createFinancialInvoice':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER', 'PROCUREMENT_AGENT', 'NURSE']);\n        return jsonResponse(201, createFinancialInvoice(patientId, userId, body.payload));\n\n      case 'updateInsuranceStatus':\n        assertAccess(patientId, userId, ['CARE_ADMIN', 'FAMILY_MEMBER']);\n        return jsonResponse(200, updateInvoiceInsuranceStatus(patientId, userId, body.payload));\n\n      case 'telegramWebhook':\n        return jsonResponse(200, handleTelegramWebhook(body));\n\n      default:\n        return jsonResponse(400, { error: 'عملیات درخواستی نامعتبر است.', action: action });\n    }\n  } catch (err) {\n    return handleException(err);\n  }\n}\n\n/* ============================================================================\n * ۲. راه‌اندازی دیتابیس و مقداردهی اولیه (Database Setup & Seeding)\n * ============================================================================ */\n\nfunction getSpreadsheet() {\n  const props = PropertiesService.getScriptProperties();\n  let ssId = props.getProperty('SPREADSHEET_ID');\n  if (ssId) {\n    try {\n      return SpreadsheetApp.openById(ssId);\n    } catch (e) {\n      // اگر فایل پاک شده بود مجدداً می‌سازیم\n    }\n  }\n  try {\n    const active = SpreadsheetApp.getActiveSpreadsheet();\n    if (active) {\n      props.setProperty('SPREADSHEET_ID', active.getId());\n      return active;\n    }\n  } catch (e) {}\n\n  const created = SpreadsheetApp.create('CareSync_Pro_Database');\n  props.setProperty('SPREADSHEET_ID', created.getId());\n  return created;\n}\n\nfunction setupDatabase(shouldSeed) {\n  const ss = getSpreadsheet();\n  const tableNames = Object.keys(DB_SCHEMA);\n\n  tableNames.forEach(tableName => {\n    let sheet = ss.getSheetByName(tableName);\n    if (!sheet) {\n      sheet = ss.insertSheet(tableName);\n    }\n    const headers = DB_SCHEMA[tableName];\n    if (sheet.getLastRow() === 0) {\n      sheet.getRange(1, 1, 1, headers.length).setValues([headers]);\n      sheet.getRange(1, 1, 1, headers.length)\n        .setFontWeight('bold')\n        .setBackground('#1e293b')\n        .setFontColor('#ffffff');\n      sheet.setFrozenRows(1);\n    }\n  });\n\n  // حذف شیت پیش‌فرض Sheet1 در صورت خالی بودن\n  const defaultSheet = ss.getSheetByName('Sheet1');\n  if (defaultSheet && ss.getSheets().length > 1 && defaultSheet.getLastRow() <= 1) {\n    try { ss.deleteSheet(defaultSheet); } catch (e) {}\n  }\n\n  let seeded = false;\n  if (shouldSeed || getTableRows('patients').length === 0) {\n    seedDemoData();\n    seeded = true;\n  }\n\n  return {\n    ok: true,\n    spreadsheetId: ss.getId(),\n    spreadsheetUrl: ss.getUrl(),\n    tablesCreated: tableNames.length,\n    seeded: seeded,\n    version: APP_VERSION\n  };\n}\n\nfunction seedDemoData() {\n  const now = new Date().toISOString();\n  const users = [\n    {\n      id: 'user-admin', full_name: 'سرپرست پرونده', phone_number: '',\n      email: '', password_hash: '', telegram_chat_id: '',\n      telegram_username: '', avatar_url: '', system_role: 'USER',\n      is_active: true, last_login_at: now, created_at: now, updated_at: now\n    }\n  ];\n  clearAndSeedTable('users', users);\n}\n\n/* ============================================================================\n * ۳. میان‌افزار بررسی دسترسی و ایزولاسیون پرونده (PatientAccessGuard & RBAC)\n * ============================================================================ */\n\nfunction assertAccess(patientId, userId, allowedRoles, requiredPermissionKey) {\n  if (!patientId || !userId) {\n    throw createHttpError(401, 'احراز هویت یا شناسه پرونده بیمار ارسال نشده است.');\n  }\n  const members = getTableRows('care_circle_members').filter(\n    m => String(m.patient_id) === String(patientId) && String(m.user_id) === String(userId)\n  );\n  if (members.length === 0) {\n    throw createHttpError(403, 'عدم دسترسی (IDOR Protection): شما عضو حلقه مراقبت این بیمار نیستید.');\n  }\n  const member = members[0];\n  if (allowedRoles && allowedRoles.length > 0 && allowedRoles.indexOf(member.role) === -1) {\n    if (requiredPermissionKey) {\n      const perms = safeJsonParse(member.permissions, {});\n      if (perms[requiredPermissionKey] === true) {\n        return member;\n      }\n    }\n    throw createHttpError(403, 'نقش کاربری شما (' + member.role + ') مجوز انجام این عملیات را ندارد.');\n  }\n  return member;\n}\n\n/* ============================================================================\n * ۴. موتورهای منطق تجاری (Core Business Engines - Sections 7 & 8)\n * ============================================================================ */\n\n/**\n * قانون ۸.۱.۲: اجبار اطلاعات لجستیک در صورت نیاز به حضور فیزیکی بیمار\n */\nfunction createDoctorAppointment(patientId, userId, payload) {\n  const requiresPresence = payload.requiresPatientPresence !== false;\n  if (requiresPresence) {\n    if (!payload.transportMethod || payload.transportMethod === 'NONE_PROXY_ONLY') {\n      throw createHttpError(422, 'خطای اعتبارسنجی لجستیک (422): با توجه به الزام حضور فیزیکی بیمار، تعیین روش حمل‌ونقل الزامی است.');\n    }\n    if (!payload.departureDatetime) {\n      throw createHttpError(422, 'خطای اعتبارسنجی لجستیک (422): ساعت حرکت از منزل برای آماده‌سازی بیمار الزامی است.');\n    }\n    if (!Array.isArray(payload.escorts) || payload.escorts.length === 0) {\n      throw createHttpError(422, 'خطای اعتبارسنجی لجستیک (422): حداقل یک نفر همراه برای بردن بیمار به مطب باید تعیین شود.');\n    }\n  }\n\n  const now = new Date().toISOString();\n  const appointmentId = 'apt-' + Utilities.getUuid().slice(0, 8);\n  const record = {\n    id: appointmentId,\n    patient_id: patientId,\n    created_by_user_id: userId,\n    doctor_name: payload.doctorName,\n    specialty: payload.specialty || 'متخصص داخلی',\n    clinic_name_and_address: payload.clinicNameAndAddress,\n    clinic_phone: payload.clinicPhone || '',\n    appointment_datetime: payload.appointmentDatetime,\n    visit_reason: payload.visitReason,\n    requires_patient_presence: requiresPresence,\n    transport_method: requiresPresence ? payload.transportMethod : 'NONE_PROXY_ONLY',\n    vehicle_owner_or_details: payload.vehicleOwnerOrDetails || '',\n    departure_datetime: payload.departureDatetime || '',\n    required_equipment_checklist: JSON.stringify(payload.requiredEquipmentChecklist || []),\n    logistics_instructions: payload.logisticsInstructions || '',\n    status: 'SCHEDULED',\n    created_at: now,\n    updated_at: now,\n    deleted_at: ''\n  };\n\n  insertRow('doctor_appointments', record);\n\n  const createdEscorts = [];\n  if (Array.isArray(payload.escorts)) {\n    payload.escorts.forEach(esc => {\n      const escRow = {\n        id: 'esc-' + Utilities.getUuid().slice(0, 8),\n        appointment_id: appointmentId,\n        member_user_id: esc.memberUserId,\n        escort_role: esc.escortRole || 'MEDICAL_COMPANION',\n        confirmation_status: 'PENDING',\n        notes: esc.notes || ''\n      };\n      insertRow('appointment_escorts', escRow);\n      createdEscorts.push(escRow);\n    });\n  }\n\n  appendAuditLog(patientId, userId, 'CREATE_APPOINTMENT', 'doctor_appointments', appointmentId,\n    'ثبت نوبت دکتر ' + payload.doctorName + ' (' + payload.specialty + ')', record);\n\n  return { appointment: record, escorts: createdEscorts };\n}\n\n/**\n * بخش ۷.۲.۲: ثبت معاینه پزشک و همگام‌سازی خودکار وضعیت سلامت بیمار در جدول patients\n */\nfunction createClinicalAssessment(patientId, userId, payload) {\n  const score = Number(payload.healthScore || 75);\n  if (score < 1 || score > 100) {\n    throw createHttpError(422, 'امتیاز سلامت بیمار باید عددی بین ۱ تا ۱۰۰ باشد.');\n  }\n\n  const now = new Date().toISOString();\n  const assessmentId = 'ass-' + Utilities.getUuid().slice(0, 8);\n  const record = {\n    id: assessmentId,\n    patient_id: patientId,\n    appointment_id: payload.appointmentId || '',\n    recorded_by_user_id: userId,\n    doctor_name: payload.doctorName,\n    examination_date: payload.examinationDate || now,\n    health_status: payload.healthStatus || 'STABLE',\n    health_score: score,\n    mobility_status: payload.mobilityStatus || 'WHEELCHAIR',\n    consciousness_level: payload.consciousnessLevel || 'ALERT',\n    active_problems_diagnosis: payload.activeProblemsDiagnosis,\n    doctor_recommendations: payload.doctorRecommendations,\n    next_visit_suggested_date: payload.nextVisitSuggestedDate || '',\n    created_at: now\n  };\n\n  insertRow('clinical_assessments', record);\n\n  // همگام‌سازی خودکار وضعیت فعلی بیمار در جدول patients\n  updateRowsWhere('patients', p => String(p.id) === String(patientId), p => {\n    p.current_health_status = record.health_status;\n    p.current_health_score = record.health_score;\n    p.current_mobility_status = record.mobility_status;\n    p.current_consciousness = record.consciousness_level;\n    p.current_clinical_summary = record.doctor_recommendations;\n    p.last_examined_at = record.examination_date;\n    p.updated_at = now;\n    return p;\n  });\n\n  if (payload.appointmentId) {\n    updateRowsWhere('doctor_appointments', a => String(a.id) === String(payload.appointmentId), a => {\n      a.status = 'COMPLETED';\n      a.updated_at = now;\n      return a;\n    });\n  }\n\n  appendAuditLog(patientId, userId, 'RECORD_CLINICAL_ASSESSMENT', 'clinical_assessments', assessmentId,\n    'ثبت معاینه بالینی توسط ' + payload.doctorName + ' (امتیاز سلامت: ' + score + ')', record);\n\n  return { assessment: record };\n}\n\n/**\n * بخش ۴ و ۸.۱.۳: موتور هوشمند موجودی دارو و تدارکات (InventoryCalculatorService)\n * جلوگیری از منفی شدن موجودی و صدور Idempotent سفارش خرید\n */\nfunction calculateInventoryMetrics(currentStock, dailyRate, thresholdDays) {\n  const safeStock = Math.max(0, Number(currentStock || 0));\n  const safeRate = Math.max(0.1, Number(dailyRate || 1));\n  const safeThresholdDays = Math.max(1, Number(thresholdDays || 5));\n  const daysRemaining = Math.floor(safeStock / safeRate);\n  const thresholdQty = safeRate * safeThresholdDays;\n\n  let stockStatus = 'IN_STOCK';\n  if (safeStock <= 0) {\n    stockStatus = 'OUT_OF_STOCK';\n  } else if (daysRemaining <= safeThresholdDays || safeStock <= thresholdQty) {\n    stockStatus = 'LOW_STOCK';\n  } else if (daysRemaining >= safeThresholdDays * 3) {\n    stockStatus = 'NEWLY_PURCHASED';\n  }\n\n  const depletionDate = new Date(Date.now() + daysRemaining * 86400000).toISOString().slice(0, 10);\n\n  return {\n    currentStock: safeStock,\n    daysRemaining: daysRemaining,\n    thresholdQty: thresholdQty,\n    stockStatus: stockStatus,\n    estimatedDepletionDate: depletionDate\n  };\n}\n\nfunction ensureIdempotentProcurementOrder(patientId, item, metrics) {\n  if (metrics.stockStatus !== 'LOW_STOCK' && metrics.stockStatus !== 'OUT_OF_STOCK') {\n    return null;\n  }\n  const existingOrders = getTableRows('procurement_orders').filter(\n    o => String(o.patient_id) === String(patientId) &&\n         String(o.inventory_item_id) === String(item.id) &&\n         (o.status === 'PENDING_PURCHASE' || o.status === 'IN_PROGRESS')\n  );\n  if (existingOrders.length > 0) {\n    // قانون ۸.۱.۳: جلوگیری از ایجاد سفارش تکراری و اسپم شدن مسئول خرید\n    return existingOrders[0];\n  }\n\n  const now = new Date().toISOString();\n  const orderId = 'prc-' + Utilities.getUuid().slice(0, 8);\n  const newOrder = {\n    id: orderId,\n    patient_id: patientId,\n    inventory_item_id: item.id,\n    assigned_purchaser_user_id: item.designated_purchaser_user_id || 'user-admin',\n    status: 'PENDING_PURCHASE',\n    urgency: metrics.stockStatus === 'OUT_OF_STOCK' ? 'CRITICAL_OUT_OF_STOCK' : 'HIGH_LOW_STOCK',\n    requested_quantity: Math.max(30, Number(item.daily_consumption_rate || 1) * 30),\n    purchased_quantity: '',\n    total_cost_amount: '',\n    financial_record_id: '',\n    alert_sent_at: now,\n    purchased_at: '',\n    created_at: now,\n    updated_at: now\n  };\n\n  insertRow('procurement_orders', newOrder);\n  return newOrder;\n}\n\nfunction consumeInventoryItem(patientId, userId, payload) {\n  const itemId = payload.itemId;\n  const qtyUsed = Math.max(0, Number(payload.quantityUsed || 1));\n  const status = payload.status || 'TAKEN';\n  const now = new Date().toISOString();\n\n  let updatedItem = null;\n  updateRowsWhere('inventory_items', it => String(it.id) === String(itemId) && String(it.patient_id) === String(patientId), it => {\n    const newStock = status === 'TAKEN'\n      ? Math.max(0, Number(it.current_stock_quantity || 0) - qtyUsed)\n      : Number(it.current_stock_quantity || 0);\n    const metrics = calculateInventoryMetrics(newStock, it.daily_consumption_rate, it.low_stock_threshold_days);\n    it.current_stock_quantity = metrics.currentStock;\n    it.low_stock_threshold_quantity = metrics.thresholdQty;\n    it.stock_status = metrics.stockStatus;\n    it.estimated_depletion_date = metrics.estimatedDepletionDate;\n    it.updated_at = now;\n    updatedItem = Object.assign({}, it, { days_remaining: metrics.daysRemaining });\n    return it;\n  });\n\n  if (!updatedItem) {\n    throw createHttpError(404, 'دارو یا کالای مصرفی موردنظر یافت نشد.');\n  }\n\n  const logEntry = {\n    id: 'mcl-' + Utilities.getUuid().slice(0, 8),\n    inventory_item_id: itemId,\n    patient_id: patientId,\n    administered_by_user_id: userId,\n    scheduled_for: payload.scheduledFor || now,\n    taken_at: now,\n    status: status,\n    quantity_used: status === 'TAKEN' ? qtyUsed : 0,\n    notes: payload.notes || ''\n  };\n  insertRow('medication_consumption_logs', logEntry);\n\n  const metrics = calculateInventoryMetrics(\n    updatedItem.current_stock_quantity,\n    updatedItem.daily_consumption_rate,\n    updatedItem.low_stock_threshold_days\n  );\n  const procurementOrder = ensureIdempotentProcurementOrder(patientId, updatedItem, metrics);\n\n  appendAuditLog(patientId, userId, 'CONSUME_MEDICATION', 'medication_consumption_logs', logEntry.id,\n    'ثبت نوبت مصرف «' + updatedItem.name + '» با وضعیت ' + status + ' (موجودی فعلی: ' + updatedItem.current_stock_quantity + ')', logEntry);\n\n  return {\n    item: updatedItem,\n    consumptionLog: logEntry,\n    procurementOrder: procurementOrder\n  };\n}\n\n/**\n * سناریوی مرزی ۸.۲.۳: تغییر دوز مصرفی دارو توسط پزشک در میانه دوره و بازمحاسبه آنی\n */\nfunction updateInventoryDailyRate(patientId, userId, payload) {\n  const itemId = payload.itemId;\n  const newDailyRate = Number(payload.dailyConsumptionRate);\n  if (!newDailyRate || newDailyRate <= 0) {\n    throw createHttpError(422, 'نرخ مصرف روزانه باید بزرگ‌تر از صفر باشد.');\n  }\n  const now = new Date().toISOString();\n  let updatedItem = null;\n\n  updateRowsWhere('inventory_items', it => String(it.id) === String(itemId) && String(it.patient_id) === String(patientId), it => {\n    it.daily_consumption_rate = newDailyRate;\n    if (payload.dosageOrSpec) it.dosage_or_spec = payload.dosageOrSpec;\n    const metrics = calculateInventoryMetrics(it.current_stock_quantity, newDailyRate, it.low_stock_threshold_days);\n    it.low_stock_threshold_quantity = metrics.thresholdQty;\n    it.stock_status = metrics.stockStatus;\n    it.estimated_depletion_date = metrics.estimatedDepletionDate;\n    it.updated_at = now;\n    updatedItem = Object.assign({}, it, { days_remaining: metrics.daysRemaining });\n    return it;\n  });\n\n  if (!updatedItem) {\n    throw createHttpError(404, 'قلم دارویی یافت نشد.');\n  }\n\n  const metrics = calculateInventoryMetrics(\n    updatedItem.current_stock_quantity,\n    updatedItem.daily_consumption_rate,\n    updatedItem.low_stock_threshold_days\n  );\n  const procurementOrder = ensureIdempotentProcurementOrder(patientId, updatedItem, metrics);\n\n  appendAuditLog(patientId, userId, 'UPDATE_MEDICATION_DOSE', 'inventory_items', itemId,\n    'تغییر نرخ مصرف روزانه «' + updatedItem.name + '» به ' + newDailyRate + ' واحد در روز', updatedItem);\n\n  return { item: updatedItem, procurementOrder: procurementOrder };\n}\n\n/**\n * بخش ۷.۴.۳: ثبت خرید دارو/تجهیزات، شارژ خودکار موجودی و ثبت خودکار فاکتور در جدول مالی\n */\nfunction restockInventoryItem(patientId, userId, payload) {\n  const itemId = payload.itemId;\n  const purchasedQty = Number(payload.purchasedQuantity || 0);\n  const totalCost = Number(payload.totalCostAmount || 0);\n  if (purchasedQty <= 0) {\n    throw createHttpError(422, 'مقدار خریداری‌شده باید بزرگ‌تر از صفر باشد.');\n  }\n\n  const now = new Date().toISOString();\n  let updatedItem = null;\n\n  updateRowsWhere('inventory_items', it => String(it.id) === String(itemId) && String(it.patient_id) === String(patientId), it => {\n    const newStock = Number(it.current_stock_quantity || 0) + purchasedQty;\n    const metrics = calculateInventoryMetrics(newStock, it.daily_consumption_rate, it.low_stock_threshold_days);\n    it.current_stock_quantity = newStock;\n    it.stock_status = 'NEWLY_PURCHASED';\n    it.last_purchased_at = now;\n    it.estimated_depletion_date = metrics.estimatedDepletionDate;\n    it.updated_at = now;\n    updatedItem = it;\n    return it;\n  });\n\n  if (!updatedItem) {\n    throw createHttpError(404, 'دارو یا کالای موردنظر یافت نشد.');\n  }\n\n  let invoiceRecord = null;\n  if (totalCost > 0) {\n    invoiceRecord = {\n      id: 'inv-' + Utilities.getUuid().slice(0, 8),\n      patient_id: patientId,\n      recorded_by_user_id: userId,\n      paid_by_user_id: payload.paidByUserId || userId,\n      expense_category: updatedItem.item_category === 'MEDICATION' ? 'MEDICATION' : 'MEDICAL_SUPPLIES',\n      title: 'خرید مجدد ' + updatedItem.name + ' (' + purchasedQty + ' ' + updatedItem.unit + ')',\n      amount: totalCost,\n      currency: 'IRT',\n      invoice_date: now.slice(0, 10),\n      receipt_file_storage_key: payload.receiptDocumentKey || 'drive://receipt-' + Date.now(),\n      receipt_file_name: payload.receiptFileName || 'faktor-kharid.jpg',\n      insurance_claim_status: payload.insuranceClaimStatus || 'PENDING_SUBMISSION',\n      reimbursed_amount: 0,\n      notes: payload.notes || 'ثبت خودکار از ماژول تدارکات داروخانه',\n      created_at: now,\n      updated_at: now,\n      deleted_at: ''\n    };\n    insertRow('financial_invoices', invoiceRecord);\n  }\n\n  updateRowsWhere('procurement_orders',\n    o => String(o.patient_id) === String(patientId) &&\n         String(o.inventory_item_id) === String(itemId) &&\n         o.status !== 'PURCHASED_AND_STOCKED',\n    o => {\n      o.status = 'PURCHASED_AND_STOCKED';\n      o.purchased_quantity = purchasedQty;\n      o.total_cost_amount = totalCost;\n      o.financial_record_id = invoiceRecord ? invoiceRecord.id : '';\n      o.purchased_at = now;\n      o.updated_at = now;\n      return o;\n    }\n  );\n\n  appendAuditLog(patientId, userId, 'RESTOCK_INVENTORY', 'inventory_items', itemId,\n    'خرید و شارژ موجودی «' + updatedItem.name + '» به تعداد ' + purchasedQty + ' عدد', {\n      purchasedQty: purchasedQty,\n      totalCost: totalCost,\n      invoiceId: invoiceRecord ? invoiceRecord.id : null\n    });\n\n  return { item: updatedItem, invoice: invoiceRecord };\n}\n\n/**\n * بخش ۵ و ۷.۵: ثبت علائم حیاتی و موتور ارزیابی محدوده مجاز (Threshold Evaluator)\n */\nfunction evaluateVitalThresholds(vitals, customThresholds) {\n  const t = Object.assign({\n    systolicMax: 145, systolicCritical: 165,\n    diastolicMax: 90, diastolicCritical: 105,\n    spo2Min: 92, spo2Critical: 88,\n    glucoseFastingMax: 130, glucoseCritical: 220,\n    heartRateMin: 55, heartRateMax: 100,\n    tempMax: 37.6, tempCritical: 38.3\n  }, customThresholds || {});\n\n  let status = 'NORMAL';\n  const reasons = [];\n\n  const sys = Number(vitals.systolicBp || 0);\n  const dia = Number(vitals.diastolicBp || 0);\n  const spo2 = Number(vitals.spo2 || 0);\n  const glu = Number(vitals.bloodGlucose || 0);\n  const hr = Number(vitals.heartRate || 0);\n  const temp = Number(vitals.bodyTemperature || 0);\n  const pain = Number(vitals.painLevel || 0);\n\n  if ((spo2 > 0 && spo2 < t.spo2Critical) ||\n      (sys >= t.systolicCritical) ||\n      (dia >= t.diastolicCritical) ||\n      (glu >= t.glucoseCritical) ||\n      (temp >= t.tempCritical) ||\n      (pain >= 8)) {\n    status = 'CRITICAL';\n    if (spo2 > 0 && spo2 < t.spo2Critical) reasons.push('افت بحرانی اکسیژن خون (' + spo2 + '%)');\n    if (sys >= t.systolicCritical || dia >= t.diastolicCritical) reasons.push('فشار خون بحرانی (' + sys + '/' + dia + ')');\n    if (glu >= t.glucoseCritical) reasons.push('قند خون بحرانی (' + glu + ' mg/dL)');\n    if (temp >= t.tempCritical) reasons.push('تب شدید (' + temp + ' درجه)');\n    if (pain >= 8) reasons.push('سطح درد شدید (' + pain + ' از ۱۰)');\n  } else if ((spo2 > 0 && spo2 < t.spo2Min) ||\n             (sys >= t.systolicMax) ||\n             (dia >= t.diastolicMax) ||\n             (glu >= t.glucoseFastingMax) ||\n             (hr > 0 && (hr < t.heartRateMin || hr > t.heartRateMax)) ||\n             (temp >= t.tempMax) ||\n             (pain >= 5)) {\n    status = 'WARNING';\n    if (spo2 > 0 && spo2 < t.spo2Min) reasons.push('کاهش اکسیژن خون (' + spo2 + '%)');\n    if (sys >= t.systolicMax || dia >= t.diastolicMax) reasons.push('فشار خون بالاتر از حد نرمال (' + sys + '/' + dia + ')');\n    if (glu >= t.glucoseFastingMax) reasons.push('قند خون بالاتر از محدوده هدف (' + glu + ')');\n  }\n\n  return { abnormalityStatus: status, reasons: reasons };\n}\n\nfunction logVitalSigns(patientId, userId, payload) {\n  const patient = getTableRows('patients').find(p => String(p.id) === String(patientId));\n  const thresholds = patient ? safeJsonParse(patient.vital_thresholds, {}) : {};\n  const evaluation = evaluateVitalThresholds(payload, thresholds);\n\n  const now = new Date().toISOString();\n  const logId = 'vit-' + Utilities.getUuid().slice(0, 8);\n  const record = {\n    id: logId,\n    patient_id: patientId,\n    recorded_by_user_id: userId,\n    measured_at: payload.measuredAt || now,\n    systolic_bp: payload.systolicBp || '',\n    diastolic_bp: payload.diastolicBp || '',\n    heart_rate: payload.heartRate || '',\n    spo2: payload.spo2 || '',\n    blood_glucose: payload.bloodGlucose || '',\n    glucose_context: payload.glucoseContext || 'FASTING',\n    body_temperature: payload.bodyTemperature || '',\n    respiratory_rate: payload.respiratoryRate || '',\n    pain_level: payload.painLevel !== undefined ? payload.painLevel : 0,\n    abnormality_status: evaluation.abnormalityStatus,\n    clinical_notes: payload.clinicalNotes || '',\n    created_at: now\n  };\n\n  insertRow('vital_sign_logs', record);\n\n  appendAuditLog(patientId, userId, 'LOG_VITALS', 'vital_sign_logs', logId,\n    'ثبت علائم حیاتی (وضعیت: ' + evaluation.abnormalityStatus + ')', record);\n\n  return {\n    vitalLog: record,\n    abnormalityStatus: evaluation.abnormalityStatus,\n    reasons: evaluation.reasons,\n    suggestSos: evaluation.abnormalityStatus === 'CRITICAL'\n  };\n}\n\n/**\n * بخش ۶، ۷.۶ و ۸.۲.۱: مدیریت شیفت‌ها و قفل تراکنش دیتابیس (LockService) برای جلوگیری از Race Condition\n */\nfunction requestShiftReplacement(patientId, userId, payload) {\n  const shiftId = payload.shiftId;\n  const now = new Date().toISOString();\n\n  // قانون ۸.۱.۱: هیچ شیفتی حذف نمی‌شود؛ فقط وضعیت به OPEN_NEEDS_REPLACEMENT تغییر می‌کند\n  let targetShift = null;\n  updateRowsWhere('care_shifts', s => String(s.id) === String(shiftId) && String(s.patient_id) === String(patientId), s => {\n    s.status = 'OPEN_NEEDS_REPLACEMENT';\n    s.updated_at = now;\n    targetShift = s;\n    return s;\n  });\n\n  if (!targetShift) {\n    throw createHttpError(404, 'شیفت موردنظر یافت نشد.');\n  }\n\n  const reqRecord = {\n    id: 'scr-' + Utilities.getUuid().slice(0, 8),\n    patient_id: patientId,\n    request_type: 'ABSENCE_REPLACEMENT',\n    source_shift_id: shiftId,\n    requester_user_id: userId,\n    target_shift_id: '',\n    target_user_id: '',\n    reason: payload.reason || 'معذوریت / سفر کاری',\n    status: 'PENDING_APPROVAL',\n    responded_at: '',\n    created_at: now,\n    updated_at: now\n  };\n\n  insertRow('shift_change_requests', reqRecord);\n\n  appendAuditLog(patientId, userId, 'REQUEST_SHIFT_REPLACEMENT', 'shift_change_requests', reqRecord.id,\n    'اعلام معذوریت و درخواست جایگزین برای ' + targetShift.shift_title, reqRecord);\n\n  return { shift: targetShift, changeRequest: reqRecord };\n}\n\nfunction claimShiftReplacementWithLock(patientId, userId, payload) {\n  const lock = LockService.getScriptLock();\n  // قفل بدبینانه (Pessimistic Lock) مشابه SELECT ... FOR UPDATE در PostgreSQL (بخش ۸.۲.۱)\n  if (!lock.tryLock(10000)) {\n    throw createHttpError(409, 'سیستم در حال پردازش درخواست همزمان دیگری است. لطفاً چند ثانیه دیگر تلاش کنید.');\n  }\n\n  try {\n    const requestId = payload.requestId;\n    const requests = getTableRows('shift_change_requests');\n    const reqObj = requests.find(r => String(r.id) === String(requestId) && String(r.patient_id) === String(patientId));\n\n    if (!reqObj) {\n      throw createHttpError(404, 'درخواست جایگزینی یافت نشد.');\n    }\n\n    if (reqObj.status !== 'PENDING_APPROVAL') {\n      const winnerUser = getTableRows('users').find(u => String(u.id) === String(reqObj.target_user_id));\n      const winnerName = winnerUser ? winnerUser.full_name : 'عضو دیگر خانواده';\n      throw createHttpError(409, 'این شیفت چند لحظه پیش توسط «' + winnerName + '» پذیرفته شد (409 Conflict).');\n    }\n\n    const now = new Date().toISOString();\n    updateRowsWhere('shift_change_requests', r => String(r.id) === String(requestId), r => {\n      r.status = 'ACCEPTED_AND_APPLIED';\n      r.target_user_id = userId;\n      r.responded_at = now;\n      r.updated_at = now;\n      return r;\n    });\n\n    let updatedShift = null;\n    updateRowsWhere('care_shifts', s => String(s.id) === String(reqObj.source_shift_id), s => {\n      s.assigned_user_id = userId;\n      s.status = 'SCHEDULED';\n      s.updated_at = now;\n      updatedShift = s;\n      return s;\n    });\n\n    appendAuditLog(patientId, userId, 'CLAIM_SHIFT_REPLACEMENT', 'care_shifts', reqObj.source_shift_id,\n      'پذیرش جایگزینی شیفت باز توسط کاربر ' + userId, { requestId: requestId, shiftId: reqObj.source_shift_id });\n\n    return { shift: updatedShift, requestId: requestId };\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction requestMutualSwap(patientId, userId, payload) {\n  const now = new Date().toISOString();\n  const sourceShiftId = payload.sourceShiftId;\n  const targetShiftId = payload.targetShiftId;\n\n  const shifts = getTableRows('care_shifts').filter(s => String(s.patient_id) === String(patientId));\n  const sourceShift = shifts.find(s => String(s.id) === String(sourceShiftId));\n  const targetShift = shifts.find(s => String(s.id) === String(targetShiftId));\n\n  if (!sourceShift || !targetShift) {\n    throw createHttpError(404, 'شیفت مبدا یا مقصد برای جابه‌جایی یافت نشد.');\n  }\n\n  updateRowsWhere('care_shifts', s => String(s.id) === String(sourceShiftId), s => {\n    s.status = 'SWAP_PENDING';\n    s.updated_at = now;\n    return s;\n  });\n\n  const reqRecord = {\n    id: 'scr-' + Utilities.getUuid().slice(0, 8),\n    patient_id: patientId,\n    request_type: 'MUTUAL_SWAP',\n    source_shift_id: sourceShiftId,\n    requester_user_id: userId,\n    target_shift_id: targetShiftId,\n    target_user_id: targetShift.assigned_user_id,\n    reason: payload.reason || 'پیشنهاد جابه‌جایی توافقی دو شیفت',\n    status: 'PENDING_APPROVAL',\n    responded_at: '',\n    created_at: now,\n    updated_at: now\n  };\n\n  insertRow('shift_change_requests', reqRecord);\n\n  appendAuditLog(patientId, userId, 'REQUEST_MUTUAL_SWAP', 'shift_change_requests', reqRecord.id,\n    'پیشنهاد جابه‌جایی توافقی شیفت ' + sourceShift.shift_title + ' با ' + targetShift.shift_title, reqRecord);\n\n  return { changeRequest: reqRecord };\n}\n\nfunction respondMutualSwapWithLock(patientId, userId, payload) {\n  const lock = LockService.getScriptLock();\n  if (!lock.tryLock(10000)) {\n    throw createHttpError(409, 'تراکنش جابه‌جایی شیفت در حال انجام است.');\n  }\n\n  try {\n    const requestId = payload.requestId;\n    const decision = payload.decision || 'ACCEPT'; // ACCEPT | REJECT\n    const reqObj = getTableRows('shift_change_requests').find(r => String(r.id) === String(requestId));\n\n    if (!reqObj || reqObj.status !== 'PENDING_APPROVAL') {\n      throw createHttpError(409, 'این درخواست جابه‌جایی قبلاً تعیین تکلیف شده است.');\n    }\n\n    const now = new Date().toISOString();\n    if (decision === 'REJECT') {\n      updateRowsWhere('shift_change_requests', r => String(r.id) === String(requestId), r => {\n        r.status = 'REJECTED';\n        r.responded_at = now;\n        r.updated_at = now;\n        return r;\n      });\n      updateRowsWhere('care_shifts', s => String(s.id) === String(reqObj.source_shift_id), s => {\n        s.status = 'SCHEDULED';\n        s.updated_at = now;\n        return s;\n      });\n      return { status: 'REJECTED', requestId: requestId };\n    }\n\n    // جابه‌جایی اتمیک صاحبان دو شیفت (Atomic Transaction)\n    const shifts = getTableRows('care_shifts');\n    const s1 = shifts.find(s => String(s.id) === String(reqObj.source_shift_id));\n    const s2 = shifts.find(s => String(s.id) === String(reqObj.target_shift_id));\n\n    if (!s1 || !s2) {\n      throw createHttpError(404, 'یکی از شیفت‌های طرف تراکنش یافت نشد.');\n    }\n\n    const userA = s1.assigned_user_id;\n    const userB = s2.assigned_user_id;\n\n    updateRowsWhere('care_shifts', s => String(s.id) === String(s1.id), s => {\n      s.assigned_user_id = userB;\n      s.status = 'SCHEDULED';\n      s.updated_at = now;\n      return s;\n    });\n\n    updateRowsWhere('care_shifts', s => String(s.id) === String(s2.id), s => {\n      s.assigned_user_id = userA;\n      s.status = 'SCHEDULED';\n      s.updated_at = now;\n      return s;\n    });\n\n    updateRowsWhere('shift_change_requests', r => String(r.id) === String(requestId), r => {\n      r.status = 'ACCEPTED_AND_APPLIED';\n      r.responded_at = now;\n      r.updated_at = now;\n      return r;\n    });\n\n    appendAuditLog(patientId, userId, 'ATOMIC_SHIFT_SWAP', 'care_shifts', s1.id + '<->' + s2.id,\n      'جابه‌جایی اتمیک شیفت بین ' + userA + ' و ' + userB, { requestId: requestId });\n\n    return { status: 'ACCEPTED_AND_APPLIED', requestId: requestId };\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n/**\n * بخش ۳.۳.۱: فرم تحویل شیفت دیجیتال ۳۰ ثانیه‌ای (Structured Shift Handover Protocol)\n */\nfunction submitShiftHandover(patientId, userId, payload) {\n  const shiftId = payload.shiftId;\n  const now = new Date().toISOString();\n  let updatedShift = null;\n\n  updateRowsWhere('care_shifts', s => String(s.id) === String(shiftId) && String(s.patient_id) === String(patientId), s => {\n    if (payload.mode === 'CHECK_IN') {\n      s.checked_in_at = now;\n      s.status = 'IN_PROGRESS';\n    } else {\n      s.handover_notes = payload.handoverNotes || '';\n      s.handover_checklist = JSON.stringify(payload.handoverChecklist || {});\n      s.checked_out_at = now;\n      s.status = 'COMPLETED';\n    }\n    s.updated_at = now;\n    updatedShift = s;\n    return s;\n  });\n\n  appendAuditLog(patientId, userId, 'SHIFT_HANDOVER', 'care_shifts', shiftId,\n    payload.mode === 'CHECK_IN' ? 'ثبت شروع و تحویل گرفتن شیفت' : 'ثبت فرم تحویل شیفت دیجیتال', payload);\n\n  return { shift: updatedShift };\n}\n\n/**\n * بخش ۷ و ۸.۲.۲: سیستم هشدار اورژانسی SOS چندکاناله با Dual-Provider SMS Failover و Telegram Broadcast\n */\nfunction triggerEmergencySos(patientId, userId, payload) {\n  const now = new Date().toISOString();\n  const alertId = 'sos-' + Utilities.getUuid().slice(0, 8);\n\n  const latestVitals = getTableRows('vital_sign_logs')\n    .filter(v => String(v.patient_id) === String(patientId))\n    .sort((a, b) => String(b.measured_at).localeCompare(String(a.measured_at)))[0] || {};\n\n  const members = getTableRows('care_circle_members')\n    .filter(m => String(m.patient_id) === String(patientId));\n  const users = getTableRows('users');\n\n  const smsReport = dispatchDualProviderSms(members, users, payload);\n  const telegramReport = dispatchTelegramSosBroadcast(members, users, payload, alertId);\n\n  const alertRecord = {\n    id: alertId,\n    patient_id: patientId,\n    triggered_by_user_id: userId,\n    severity: payload.severity || 'EMERGENCY_HOSPITAL_TRANSFER',\n    reason_title: payload.reasonTitle || 'وخامت ناگهانی وضعیت بیمار',\n    details: payload.details || '',\n    destination_hospital: payload.destinationHospital || 'بیمارستان کسری تهران',\n    snapshot_vitals: JSON.stringify(payload.snapshotVitals || latestVitals),\n    status: 'ACTIVE_EMERGENCY',\n    acknowledged_by_users: JSON.stringify([\n      { userId: userId, acknowledgedAt: now, note: 'ثبت‌کننده هشدار در کنار بیمار' }\n    ]),\n    sms_delivery_report: JSON.stringify(smsReport),\n    telegram_delivery_report: JSON.stringify(telegramReport),\n    triggered_at: now,\n    resolved_at: ''\n  };\n\n  insertRow('emergency_alerts', alertRecord);\n\n  // بروزرسانی وضعیت بیمار به CRITICAL یا HOSPITALIZED\n  updateRowsWhere('patients', p => String(p.id) === String(patientId), p => {\n    p.current_health_status = payload.severity === 'EMERGENCY_HOSPITAL_TRANSFER' ? 'HOSPITALIZED' : 'CRITICAL';\n    p.updated_at = now;\n    return p;\n  });\n\n  appendAuditLog(patientId, userId, 'TRIGGER_EMERGENCY_SOS', 'emergency_alerts', alertId,\n    'اعلام وضعیت اورژانسی SOS: ' + alertRecord.reason_title, alertRecord);\n\n  return { alert: alertRecord };\n}\n\nfunction acknowledgeEmergencySos(patientId, userId, payload) {\n  const alertId = payload.alertId;\n  const now = new Date().toISOString();\n  let updatedAlert = null;\n\n  updateRowsWhere('emergency_alerts', a => String(a.id) === String(alertId) && String(a.patient_id) === String(patientId), a => {\n    const acks = safeJsonParse(a.acknowledged_by_users, []);\n    if (!acks.some(x => String(x.userId) === String(userId))) {\n      acks.push({\n        userId: userId,\n        acknowledgedAt: now,\n        note: payload.note || 'متوجه شدم / در راهم'\n      });\n    }\n    a.acknowledged_by_users = JSON.stringify(acks);\n    updatedAlert = a;\n    return a;\n  });\n\n  return { alert: updatedAlert };\n}\n\nfunction resolveEmergencySos(patientId, userId, payload) {\n  const alertId = payload.alertId;\n  const now = new Date().toISOString();\n  let updatedAlert = null;\n\n  updateRowsWhere('emergency_alerts', a => String(a.id) === String(alertId) && String(a.patient_id) === String(patientId), a => {\n    a.status = payload.resolutionStatus || 'PATIENT_STABILIZED';\n    a.resolved_at = now;\n    updatedAlert = a;\n    return a;\n  });\n\n  updateRowsWhere('patients', p => String(p.id) === String(patientId), p => {\n    p.current_health_status = 'STABLE';\n    p.updated_at = now;\n    return p;\n  });\n\n  appendAuditLog(patientId, userId, 'RESOLVE_EMERGENCY_SOS', 'emergency_alerts', alertId,\n    'پایان وضعیت اورژانسی و پایدارسازی بیمار', payload);\n\n  return { alert: updatedAlert };\n}\n\n/**\n * بخش ۸.۲.۲: ارسال پیامک اورژانسی با معماری Dual-Provider SMS Failover (کاوه‌نگار -> ملی‌پیامک)\n */\nfunction dispatchDualProviderSms(members, users, payload) {\n  const props = PropertiesService.getScriptProperties();\n  const kavenegarKey = props.getProperty('KAVENEGAR_API_KEY');\n  const melipayamakKey = props.getProperty('MELIPAYAMAK_API_KEY');\n  const recipients = members\n    .filter(m => m.receive_sms_alerts !== false)\n    .map(m => users.find(u => String(u.id) === String(m.user_id)))\n    .filter(Boolean);\n\n  if (!kavenegarKey && !melipayamakKey) {\n    return {\n      mode: 'SANDBOX_SIMULATED',\n      primaryProvider: 'Kavenegar (VerifyLookup)',\n      fallbackProvider: 'MeliPayamak (ServiceLine)',\n      recipientsCount: recipients.length,\n      deliveredAt: new Date().toISOString()\n    };\n  }\n\n  try {\n    if (kavenegarKey) {\n      const resp = UrlFetchApp.fetch('https://api.kavenegar.com/v1/' + kavenegarKey + '/verify/lookup.json', {\n        method: 'post',\n        payload: {\n          receptor: recipients.map(r => r.phone_number).join(','),\n          token: 'SOS-ALERT',\n          template: 'caresync-sos'\n        },\n        muteHttpExceptions: true\n      });\n      if (resp.getResponseCode() === 200) {\n        return { mode: 'LIVE', providerUsed: 'KAVENEGAR_PRIMARY', recipientsCount: recipients.length };\n      }\n    }\n  } catch (e) {\n    // در صورت خطا یا تایم‌اوت درگاه اول، بلافاصله درگاه پشتیبان فراخوانی می‌شود\n  }\n\n  return {\n    mode: 'FAILOVER_EXECUTED',\n    providerUsed: 'MELIPAYAMAK_BACKUP',\n    recipientsCount: recipients.length,\n    deliveredAt: new Date().toISOString()\n  };\n}\n\nfunction dispatchTelegramSosBroadcast(members, users, payload, alertId) {\n  const props = PropertiesService.getScriptProperties();\n  const botToken = props.getProperty('TELEGRAM_BOT_TOKEN');\n  if (!botToken) {\n    return {\n      mode: 'SANDBOX_SIMULATED',\n      inlineButtonsSent: true,\n      alertId: alertId\n    };\n  }\n\n  let sentCount = 0;\n  members.forEach(m => {\n    const u = users.find(usr => String(usr.id) === String(m.user_id));\n    if (u && u.telegram_chat_id) {\n      try {\n        UrlFetchApp.fetch('https://api.telegram.org/bot' + botToken + '/sendMessage', {\n          method: 'post',\n          contentType: 'application/json',\n          payload: JSON.stringify({\n            chat_id: u.telegram_chat_id,\n            text: '🚨 هشدار اورژانسی CareSync Pro\\nعلت: ' + payload.reasonTitle + '\\nبیمارستان مقصد: ' + (payload.destinationHospital || 'کسری'),\n            reply_markup: {\n              inline_keyboard: [[\n                { text: '✅ متوجه شدم / در راهم', callback_data: 'ACK_SOS:' + alertId + ':' + u.id }\n              ]]\n            }\n          }),\n          muteHttpExceptions: true\n        });\n        sentCount++;\n      } catch (e) {}\n    }\n  });\n  return { mode: 'LIVE', sentCount: sentCount };\n}\n\n/**\n * بخش ۸ و ۷.۷: آپلود اسناد پزشکی به Google Drive و محاسبه تراز مالی اعضای خانواده\n */\nfunction uploadMedicalDocument(patientId, userId, payload) {\n  const now = new Date().toISOString();\n  let storageKey = payload.fileStorageKey || ('drive://doc-' + Date.now());\n\n  if (payload.base64Content && payload.fileName) {\n    try {\n      const folderName = 'CareSync_Vault_' + patientId;\n      const folders = DriveApp.getFoldersByName(folderName);\n      const folder = folders.hasNext() ? folders.next() : DriveApp.createFolder(folderName);\n      const decoded = Utilities.base64Decode(payload.base64Content.split(',').pop());\n      const blob = Utilities.newBlob(decoded, payload.fileMimeType || 'application/pdf', payload.fileName);\n      const driveFile = folder.createFile(blob);\n      storageKey = driveFile.getUrl();\n    } catch (e) {\n      storageKey = 'local-vault://' + payload.fileName;\n    }\n  }\n\n  const docRecord = {\n    id: 'doc-' + Utilities.getUuid().slice(0, 8),\n    patient_id: patientId,\n    uploaded_by_user_id: userId,\n    related_assessment_id: payload.relatedAssessmentId || '',\n    related_order_id: payload.relatedOrderId || '',\n    category: payload.category || 'LAB_RESULT',\n    title: payload.title,\n    document_actual_date: payload.documentActualDate || now.slice(0, 10),\n    file_storage_key: storageKey,\n    file_name: payload.fileName || 'medical-document.pdf',\n    file_mime_type: payload.fileMimeType || 'application/pdf',\n    file_size_bytes: Number(payload.fileSizeBytes || 245000),\n    description_tags: payload.descriptionTags || '',\n    created_at: now,\n    deleted_at: ''\n  };\n\n  insertRow('medical_documents', docRecord);\n  appendAuditLog(patientId, userId, 'UPLOAD_MEDICAL_DOCUMENT', 'medical_documents', docRecord.id,\n    'آپلود سند پزشکی «' + docRecord.title + '» با تاریخ واقعی ' + docRecord.document_actual_date, docRecord);\n\n  return { document: docRecord };\n}\n\nfunction createFinancialInvoice(patientId, userId, payload) {\n  const now = new Date().toISOString();\n  const invRecord = {\n    id: 'inv-' + Utilities.getUuid().slice(0, 8),\n    patient_id: patientId,\n    recorded_by_user_id: userId,\n    paid_by_user_id: payload.paidByUserId || userId,\n    expense_category: payload.expenseCategory || 'MEDICATION',\n    title: payload.title,\n    amount: Number(payload.amount || 0),\n    currency: 'IRT',\n    invoice_date: payload.invoiceDate || now.slice(0, 10),\n    receipt_file_storage_key: payload.receiptFileStorageKey || 'drive://receipt',\n    receipt_file_name: payload.receiptFileName || 'receipt.jpg',\n    insurance_claim_status: payload.insuranceClaimStatus || 'PENDING_SUBMISSION',\n    reimbursed_amount: Number(payload.reimbursedAmount || 0),\n    notes: payload.notes || '',\n    created_at: now,\n    updated_at: now,\n    deleted_at: ''\n  };\n\n  insertRow('financial_invoices', invRecord);\n  appendAuditLog(patientId, userId, 'CREATE_FINANCIAL_INVOICE', 'financial_invoices', invRecord.id,\n    'ثبت فاکتور مالی «' + invRecord.title + '» به مبلغ ' + invRecord.amount + ' تومان', invRecord);\n\n  return { invoice: invRecord, summary: getFinancialSummary(patientId) };\n}\n\nfunction getFinancialSummary(patientId) {\n  const invoices = getTableRows('financial_invoices')\n    .filter(inv => String(inv.patient_id) === String(patientId) && !inv.deleted_at);\n  const members = getTableRows('care_circle_members')\n    .filter(m => String(m.patient_id) === String(patientId) &&\n                 (m.role === 'CARE_ADMIN' || m.role === 'FAMILY_MEMBER' || m.role === 'PROCUREMENT_AGENT'));\n  const users = getTableRows('users');\n\n  const totalGross = invoices.reduce((sum, i) => sum + Number(i.amount || 0), 0);\n  const totalReimbursed = invoices.reduce((sum, i) => sum + Number(i.reimbursed_amount || 0), 0);\n  const netCost = Math.max(0, totalGross - totalReimbursed);\n  const contributorCount = Math.max(1, members.length);\n  const equalSharePerMember = Math.round(netCost / contributorCount);\n\n  const memberBalances = members.map(m => {\n    const u = users.find(usr => String(usr.id) === String(m.user_id)) || {};\n    const paidGross = invoices\n      .filter(i => String(i.paid_by_user_id) === String(m.user_id))\n      .reduce((s, i) => s + Number(i.amount || 0) - Number(i.reimbursed_amount || 0), 0);\n    const netBalance = paidGross - equalSharePerMember;\n    return {\n      userId: m.user_id,\n      fullName: u.full_name || m.relationship_title,\n      relationshipTitle: m.relationship_title,\n      paidNet: paidGross,\n      fairShare: equalSharePerMember,\n      balance: netBalance,\n      status: netBalance > 0 ? 'CREDITOR' : (netBalance < 0 ? 'DEBTOR' : 'SETTLED')\n    };\n  });\n\n  return {\n    totalGross: totalGross,\n    totalReimbursed: totalReimbursed,\n    netFamilyExpense: netCost,\n    equalSharePerMember: equalSharePerMember,\n    memberBalances: memberBalances\n  };\n}\n\n/* ============================================================================\n * ۵. جاب زمان‌بندی‌شده ساعتی (Hourly Time-Driven Worker - Section 5.2.3)\n * ============================================================================ */\n\nfunction runHourlyInventoryAndShiftWorker() {\n  const items = getTableRows('inventory_items').filter(i => i.is_active !== false && !i.deleted_at);\n  const alertsCreated = [];\n\n  items.forEach(item => {\n    const metrics = calculateInventoryMetrics(\n      item.current_stock_quantity,\n      item.daily_consumption_rate,\n      item.low_stock_threshold_days\n    );\n    const order = ensureIdempotentProcurementOrder(item.patient_id, item, metrics);\n    if (order) alertsCreated.push(order.id);\n  });\n\n  return { checkedItems: items.length, procurementOrdersEnsured: alertsCreated.length };\n}\n\n/* ============================================================================\n * ۶. توابع کمکی دیتابیس شیت و لاگ حسابرسی (Sheet He
