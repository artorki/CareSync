      const btnSkel = document.getElementById('btnTriggerSkeletonDemo');
      if (btnSkel) {
        btnSkel.addEventListener('click', () => {
          const skel = document.getElementById('mainSkeletonContainer');
          const view = document.getElementById('viewContainer');
          if (skel && view) {
            view.classList.add('hidden');
            skel.classList.remove('hidden');
            setTimeout(() => {
              skel.classList.add('hidden');
              view.classList.remove('hidden');
              showToast('بارگذاری بدون پرش چیدمان (Zero Layout Shift)', 'اسکلتون شیمر استاندارد بخش ۴.۳ با موفقیت تست شد.', 'info');
            }, 950);
          }
        });
      }

      // دکمه تلاش مجدد در بنر خطا
      const btnRetry = document.getElementById('btnRetryErrorState');
      if (btnRetry) {
        btnRetry.addEventListener('click', () => {
          hideErrorBanner();
          renderActiveView();
          showToast('ارتباط مجدداً برقرار شد', 'داده‌ها بازخوانی شدند.', 'success');
        });
      }

      // دکمه‌های مودال‌های سراسری در هدر
      const btnSos = document.getElementById('btnOpenSosModal');
      if (btnSos) btnSos.addEventListener('click', () => openSosModal());

      const btnGas = document.getElementById('btnOpenGasModal');
      if (btnGas) btnGas.addEventListener('click', () => openGasConnectionModal());

      const btnNotif = document.getElementById('btnOpenNotificationsModal');
      if (btnNotif) btnNotif.addEventListener('click', () => openNotificationsModal());

      const btnOtp = document.getElementById('btnOpenOtpLoginModal');
      if (btnOtp) btnOtp.addEventListener('click', () => openOtpLoginModal());

      const btnNewPat = document.getElementById('btnOpenNewPatientModal');
      if (btnNewPat) btnNewPat.addEventListener('click', () => openNewPatientModal());

      const btnPdfTop = document.getElementById('btnOpenHandoverPdfModal');
      if (btnPdfTop) btnPdfTop.addEventListener('click', () => openHandoverPdfModal());

      // دکمه‌های بنر اورژانسی بالای صفحه (تأیید رویت و پایان وضعیت اورژانسی)
      const btnAckSos = document.getElementById('btnBannerAckSos');
      if (btnAckSos) {
        btnAckSos.addEventListener('click', () => {
          const activeSos = appState.emergencyAlerts.find(a => a.patient_id === appState.activePatientId && a.status === 'ACTIVE_EMERGENCY');
          if (activeSos) {
            activeSos.acknowledged_by_users = activeSos.acknowledged_by_users || [];
            if (!activeSos.acknowledged_by_users.some(x => x.userId === appState.activeUserId)) {
              activeSos.acknowledged_by_users.push({
                userId: appState.activeUserId,
                acknowledgedAt: new Date().toISOString(),
                note: 'متوجه شدم / در راهم'
              });
            }
            saveAppState();
            updateHeaderBar();
            showToast('تأیید رویت شما ثبت شد ✅', 'نام شما به لیست افراد مطلع‌شده در کنار بیمار اضافه گردید.', 'success');
          }
        });
      }

      const btnResolveSos = document.getElementById('btnBannerResolveSos');
      if (btnResolveSos) {
        btnResolveSos.addEventListener('click', () => {
          const activeSos = appState.emergencyAlerts.find(a => a.patient_id === appState.activePatientId && a.status === 'ACTIVE_EMERGENCY');
          if (activeSos) {
            activeSos.status = 'PATIENT_STABILIZED';
            activeSos.resolved_at = new Date().toISOString();
            const patient = getActivePatient();
            patient.current_health_status = 'STABLE';
            recordAuditLog('RESOLVE_SOS', 'emergency_alerts', activeSos.id, 'پایان وضعیت اورژانسی و پایدار شدن حال بیمار');
            saveAppState();
            renderActiveView();
            showToast('وضعیت اورژانسی پایان یافت ✅', 'وضعیت بیمار به حالت پایدار (STABLE) بازگشت.', 'success');
          }
        });
      }

      // ثبت Service Worker در صورت اجرا روی HTTPS / GitHub Pages
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }

      renderActiveView();
    });
  </script>
</body>
</html>
