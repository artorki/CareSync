lpers & Audit Trail)\n * ============================================================================ */\n\nfunction getTableRows(tableName) {\n  const ss = getSpreadsheet();\n  const sheet = ss.getSheetByName(tableName);\n  if (!sheet || sheet.getLastRow() <= 1) return [];\n  const data = sheet.getDataRange().getValues();\n  const headers = data[0];\n  return data.slice(1).map(row => {\n    const obj = {};\n    headers.forEach((h, idx) => {\n      obj[h] = row[idx];\n    });\n    return obj;\n  });\n}\n\nfunction insertRow(tableName, recordObj) {\n  const ss = getSpreadsheet();\n  let sheet = ss.getSheetByName(tableName);\n  if (!sheet) {\n    setupDatabase(false);\n    sheet = ss.getSheetByName(tableName);\n  }\n  const headers = DB_SCHEMA[tableName];\n  const rowValues = headers.map(h => recordObj[h] !== undefined ? recordObj[h] : '');\n  sheet.appendRow(rowValues);\n  return recordObj;\n}\n\nfunction updateRowsWhere(tableName, predicateFn, updaterFn) {\n  const ss = getSpreadsheet();\n  const sheet = ss.getSheetByName(tableName);\n  if (!sheet || sheet.getLastRow() <= 1) return 0;\n  const data = sheet.getDataRange().getValues();\n  const headers = data[0];\n  let updatedCount = 0;\n\n  for (let r = 1; r < data.length; r++) {\n    const obj = {};\n    headers.forEach((h, idx) => { obj[h] = data[r][idx]; });\n    if (predicateFn(obj)) {\n      const updatedObj = updaterFn(obj);\n      const newRow = headers.map(h => updatedObj[h] !== undefined ? updatedObj[h] : '');\n      sheet.getRange(r + 1, 1, 1, headers.length).setValues([newRow]);\n      updatedCount++;\n    }\n  }\n  return updatedCount;\n}\n\nfunction clearAndSeedTable(tableName, records) {\n  const ss = getSpreadsheet();\n  let sheet = ss.getSheetByName(tableName);\n  if (!sheet) sheet = ss.insertSheet(tableName);\n  sheet.clearContents();\n  const headers = DB_SCHEMA[tableName];\n  const matrix = [headers];\n  records.forEach(rec => {\n    matrix.push(headers.map(h => rec[h] !== undefined ? rec[h] : ''));\n  });\n  sheet.getRange(1, 1, matrix.length, headers.length).setValues(matrix);\n}\n\nfunction appendAuditLog(patientId, actorUserId, actionType, entityTable, entityId, summary, payloadObj) {\n  const users = getTableRows('users');\n  const members = getTableRows('care_circle_members');\n  const usr = users.find(u => String(u.id) === String(actorUserId)) || {};\n  const mem = members.find(m => String(m.patient_id) === String(patientId) && String(m.user_id) === String(actorUserId)) || {};\n\n  insertRow('audit_logs', {\n    id: 'aud-' + Utilities.getUuid().slice(0, 8),\n    patient_id: patientId,\n    actor_user_id: actorUserId,\n    actor_name: usr.full_name || 'کاربر سیستم',\n    actor_role: mem.role || 'USER',\n    action_type: actionType,\n    entity_table: entityTable,\n    entity_id: entityId,\n    summary: summary,\n    payload_json: JSON.stringify(payloadObj || {}),\n    ip_or_client: 'GAS-WebApp-Client',\n    created_at: new Date().toISOString()\n  });\n}\n\nfunction getSystemHealth() {\n  const ss = getSpreadsheet();\n  return {\n    status: 'HEALTHY',\n    version: APP_VERSION,\n    databaseEngine: 'Google Sheets ACID-Locked Store',\n    spreadsheetId: ss.getId(),\n    tablesCount: Object.keys(DB_SCHEMA).length,\n    timestamp: new Date().toISOString()\n  };\n}\n\nfunction getBootstrapPayload(patientId, userId) {\n  if (getTableRows('patients').length === 0) {\n    setupDatabase(true);\n  }\n  return {\n    health: getSystemHealth(),\n    users: getTableRows('users'),\n    patients: getTableRows('patients'),\n    careCircleMembers: getTableRows('care_circle_members'),\n    doctorAppointments: getTableRows('doctor_appointments'),\n    appointmentEscorts: getTableRows('appointment_escorts'),\n    clinicalAssessments: getTableRows('clinical_assessments'),\n    medicalOrders: getTableRows('medical_orders'),\n    inventoryItems: getTableRows('inventory_items'),\n    medicationConsumptionLogs: getTableRows('medication_consumption_logs'),\n    procurementOrders: getTableRows('procurement_orders'),\n    vitalSignLogs: getTableRows('vital_sign_logs'),\n    emergencyAlerts: getTableRows('emergency_alerts'),\n    careShifts: getTableRows('care_shifts'),\n    shiftChangeRequests: getTableRows('shift_change_requests'),\n    medicalDocuments: getTableRows('medical_documents'),\n    financialInvoices: getTableRows('financial_invoices'),\n    auditLogs: getTableRows('audit_logs')\n  };\n}\n\nfunction handleRequestOtp(body) {\n  const phone = String(body.phoneNumber || '').trim();\n  if (!/^09\\d{9}$/.test(phone)) {\n    throw createHttpError(422, 'شماره موبایل واردشده معتبر نیست (مثال: 09121234567).');\n  }\n  return { ok: true, phoneNumber: phone, demoOtpCode: '124578', expiresInSeconds: 120 };\n}\n\nfunction handleVerifyOtp(body) {\n  const phone = String(body.phoneNumber || '').trim();\n  const users = getTableRows('users');\n  const user = users.find(u => String(u.phone_number) === phone) || users[0];\n  return {\n    accessToken: 'gas-jwt-' + Utilities.getUuid(),\n    user: user\n  };\n}\n\nfunction createPatientProfile(userId, payload) {\n  const now = new Date().toISOString();\n  const patientId = 'pat-' + Utilities.getUuid().slice(0, 8);\n  const record = {\n    id: patientId,\n    owner_user_id: userId,\n    full_name: payload.fullName,\n    national_code: payload.nationalCode || '',\n    birth_date: payload.birthDate || '1950-01-01',\n    gender: payload.gender || 'MALE',\n    blood_type: payload.bloodType || 'O+',\n    height_cm: payload.heightCm || 170,\n    weight_kg: payload.weightKg || 70,\n    chronic_conditions: JSON.stringify(payload.chronicConditions || []),\n    allergies: JSON.stringify(payload.allergies || []),\n    insurance_basic: payload.insuranceBasic || '',\n    insurance_supplementary: payload.insuranceSupplementary || '',\n    preferred_hospital: payload.preferredHospital || '',\n    home_address: payload.homeAddress || '',\n    emergency_notes: payload.emergencyNotes || '',\n    current_health_status: 'STABLE',\n    current_health_score: 80,\n    current_mobility_status: payload.mobilityStatus || 'ASSISTED',\n    current_consciousness: 'ALERT',\n    current_clinical_summary: 'پرونده اولیه بیمار ایجاد شد.',\n    last_examined_at: now,\n    vital_thresholds: JSON.stringify(payload.vitalThresholds || {}),\n    subscription_tier: 'PRO_FAMILY',\n    created_at: now,\n    updated_at: now,\n    deleted_at: ''\n  };\n  insertRow('patients', record);\n\n  const adminMember = {\n    id: 'ccm-' + Utilities.getUuid().slice(0, 8),\n    patient_id: patientId,\n    user_id: userId,\n    relationship_title: payload.relationshipTitle || 'سرپرست اصلی پرونده',\n    role: 'CARE_ADMIN',\n    permissions: JSON.stringify(DEFAULT_ROLE_PERMISSIONS.CARE_ADMIN),\n    receive_sms_alerts: true,\n    receive_telegram_alerts: true,\n    color_code: '#2563EB',\n    joined_at: now\n  };\n  insertRow('care_circle_members', adminMember);\n\n  return { patient: record, member: adminMember };\n}\n\nfunction addCareCircleMember(patientId, actorUserId, payload) {\n  const now = new Date().toISOString();\n  const newUserId = 'usr-' + Utilities.getUuid().slice(0, 8);\n  const userRecord = {\n    id: newUserId,\n    full_name: payload.fullName,\n    phone_number: payload.phoneNumber,\n    email: payload.email || '',\n    password_hash: 'invited_user',\n    telegram_chat_id: '',\n    telegram_username: payload.telegramUsername || '',\n    avatar_url: '',\n    system_role: 'USER',\n    is_active: true,\n    last_login_at: '',\n    created_at: now,\n    updated_at: now\n  };\n  insertRow('users', userRecord);\n\n  const role = payload.role || 'FAMILY_MEMBER';\n  const memberRecord = {\n    id: 'ccm-' + Utilities.getUuid().slice(0, 8),\n    patient_id: patientId,\n    user_id: newUserId,\n    relationship_title: payload.relationshipTitle || 'عضو خانواده',\n    role: role,\n    permissions: JSON.stringify(payload.permissions || DEFAULT_ROLE_PERMISSIONS[role] || DEFAULT_ROLE_PERMISSIONS.FAMILY_MEMBER),\n    receive_sms_alerts: true,\n    receive_telegram_alerts: true,\n    color_code: payload.colorCode || '#2563EB',\n    joined_at: now\n  };\n  insertRow('care_circle_members', memberRecord);\n\n  appendAuditLog(patientId, actorUserId, 'ADD_CARE_MEMBER', 'care_circle_members', memberRecord.id,\n    'افزودن «' + payload.fullName + '» با نقش ' + role + ' به حلقه مراقبت', memberRecord);\n\n  return {\n    user: userRecord,\n    member: memberRecord,\n    inviteToken: 'INV-' + Utilities.getUuid().slice(0, 12).toUpperCase()\n  };\n}\n\nfunction updateMemberPermissions(patientId, actorUserId, payload) {\n  let updated = null;\n  updateRowsWhere('care_circle_members',\n    m => String(m.id) === String(payload.memberId) && String(m.patient_id) === String(patientId),\n    m => {\n      if (payload.role) m.role = payload.role;\n      if (payload.permissions) m.permissions = JSON.stringify(payload.permissions);\n      updated = m;\n      return m;\n    }\n  );\n  appendAuditLog(patientId, actorUserId, 'UPDATE_MEMBER_RBAC', 'care_circle_members', payload.memberId,\n    'تغییر سطح دسترسی عضو حلقه مراقبت', payload);\n  return { member: updated };\n}\n\nfunction updateAppointmentStatus(patientId, userId, payload) {\n  const now = new Date().toISOString();\n  let updated = null;\n  updateRowsWhere('doctor_appointments',\n    a => String(a.id) === String(payload.appointmentId) && String(a.patient_id) === String(patientId),\n    a => {\n      if (payload.status) a.status = payload.status;\n      if (payload.requiredEquipmentChecklist) {\n        a.required_equipment_checklist = JSON.stringify(payload.requiredEquipmentChecklist);\n      }\n      a.updated_at = now;\n      updated = a;\n      return a;\n    }\n  );\n  return { appointment: updated };\n}\n\nfunction respondAppointmentEscort(patientId, userId, payload) {\n  let updated = null;\n  updateRowsWhere('appointment_escorts',\n    e => String(e.id) === String(payload.escortId),\n    e => {\n      e.confirmation_status = payload.confirmationStatus || 'ACCEPTED';\n      updated = e;\n      return e;\n    }\n  );\n  return { escort: updated };\n}\n\nfunction createMedicalOrder(patientId, userId, payload) {\n  const now = new Date().toISOString();\n  const orderRecord = {\n    id: 'ord-' + Utilities.getUuid().slice(0, 8),\n    patient_id: patientId,\n    assessment_id: payload.assessmentId || '',\n    order_type: payload.orderType || 'LAB_TEST',\n    title: payload.title,\n    description_and_prep: payload.descriptionAndPrep || '',\n    prescribing_doctor: payload.prescribingDoctor || '',\n    priority: payload.priority || 'ROUTINE',\n    status: payload.status || 'PENDING_SCHEDULE',\n    scheduled_datetime: payload.scheduledDatetime || '',\n    due_date: payload.dueDate || '',\n    completed_at: '',\n    requires_patient_presence: payload.requiresPatientPresence !== false,\n    location_type: payload.locationType || 'CLINIC_LAB',\n    center_name_and_address: payload.centerNameAndAddress || '',\n    assigned_to_user_id: payload.assignedToUserId || userId,\n    transport_notes: payload.transportNotes || '',\n    result_summary: '',\n    created_at: now,\n    updated_at: now,\n    deleted_at: ''\n  };\n  insertRow('medical_orders', orderRecord);\n  appendAuditLog(patientId, userId, 'CREATE_MEDICAL_ORDER', 'medical_orders', orderRecord.id,\n    'ثبت دستور پزشکی/آزمایش: ' + orderRecord.title, orderRecord);\n  return { order: orderRecord };\n}\n\nfunction updateMedicalOrderStatus(patientId, userId, payload) {\n  const now = new Date().toISOString();\n  let updated = null;\n  updateRowsWhere('medical_orders',\n    o => String(o.id) === String(payload.orderId) && String(o.patient_id) === String(patientId),\n    o => {\n      o.status = payload.status;\n      if (payload.resultSummary !== undefined) o.result_summary = payload.resultSummary;\n      if (payload.status === 'COMPLETED') o.completed_at = now;\n      o.updated_at = now;\n      updated = o;\n      return o;\n    }\n  );\n  return { order: updated };\n}\n\nfunction createInventoryItem(patientId, userId, payload) {\n  const now = new Date().toISOString();\n  const metrics = calculateInventoryMetrics(\n    payload.currentStockQuantity,\n    payload.dailyConsumptionRate,\n    payload.lowStockThresholdDays || 5\n  );\n  const itemRecord = {\n    id: 'invitem-' + Utilities.getUuid().slice(0, 8),\n    patient_id: patientId,\n    item_category: payload.itemCategory || 'MEDICATION',\n    name: payload.name,\n    dosage_or_spec: payload.dosageOrSpec || '',\n    schedule_times: JSON.stringify(payload.scheduleTimes || ['08:00', '20:00']),\n    usage_instructions: payload.usageInstructions || '',\n    unit: payload.unit || 'عدد (قرص)',\n    current_stock_quantity: metrics.currentStock,\n    daily_consumption_rate: Number(payload.dailyConsumptionRate || 1),\n    low_stock_threshold_days: Number(payload.lowStockThresholdDays || 5),\n    low_stock_threshold_quantity: metrics.thresholdQty,\n    stock_status: metrics.stockStatus,\n    designated_purchaser_user_id: payload.designatedPurchaserUserId || 'user-admin',\n    is_active: true,\n    last_purchased_at: now,\n    estimated_depletion_date: metrics.estimatedDepletionDate,\n    created_at: now,\n    updated_at: now,\n    deleted_at: ''\n  };\n  insertRow('inventory_items', itemRecord);\n  ensureIdempotentProcurementOrder(patientId, itemRecord, metrics);\n  appendAuditLog(patientId, userId, 'CREATE_INVENTORY_ITEM', 'inventory_items', itemRecord.id,\n    'تعریف قلم دارویی/تجهیزات جدید: ' + itemRecord.name, itemRecord);\n  return { item: itemRecord };\n}\n\nfunction generateShiftSchedule(patientId, userId, payload) {\n  const now = new Date().toISOString();\n  const ruleId = 'rec-' + Utilities.getUuid().slice(0, 8);\n  const createdShifts = [];\n  const assignments = payload.assignments || [];\n\n  assignments.forEach(item => {\n    const shiftRec = {\n      id: 'shf-' + Utilities.getUuid().slice(0, 8),\n      patient_id: patientId,\n      assigned_user_id: item.assignedUserId,\n      original_user_id: item.assignedUserId,\n      shift_title: item.shiftTitle,\n      start_datetime: item.startDatetime,\n      end_datetime: item.endDatetime,\n      recurrence_rule_id: ruleId,\n      status: 'SCHEDULED',\n      handover_notes: '',\n      handover_checklist: '{}',\n      checked_in_at: '',\n      checked_out_at: '',\n      created_at: now,\n      updated_at: now\n    };\n    insertRow('care_shifts', shiftRec);\n    createdShifts.push(shiftRec);\n  });\n\n  appendAuditLog(patientId, userId, 'GENERATE_SHIFT_SCHEDULE', 'care_shifts', ruleId,\n    'تولید برنامه شیفت هفتگی/ماهانه (' + createdShifts.length + ' شیفت)', { count: createdShifts.length });\n\n  return { shifts: createdShifts };\n}\n\nfunction updateInvoiceInsuranceStatus(patientId, userId, payload) {\n  const now = new Date().toISOString();\n  let updated = null;\n  updateRowsWhere('financial_invoices',\n    i => String(i.id) === String(payload.invoiceId) && String(i.patient_id) === String(patientId),\n    i => {\n      i.insurance_claim_status = payload.insuranceClaimStatus;\n      if (payload.reimbursedAmount !== undefined) {\n        i.reimbursed_amount = Number(payload.reimbursedAmount);\n      }\n      i.updated_at = now;\n      updated = i;\n      return i;\n    }\n  );\n  return { invoice: updated, summary: getFinancialSummary(patientId) };\n}\n\nfunction getVitalsAnalytics(patientId, days) {\n  const cutoff = new Date(Date.now() - days * 86400000).toISOString();\n  const logs = getTableRows('vital_sign_logs')\n    .filter(l => String(l.patient_id) === String(patientId) && String(l.measured_at) >= cutoff)\n    .sort((a, b) => String(a.measured_at).localeCompare(String(b.measured_at)));\n\n  return { count: logs.length, series: logs };\n}\n\nfunction handleTelegramWebhook(update) {\n  if (update && update.callback_query) {\n    const data = String(update.callback_query.data || '');\n    if (data.indexOf('ACK_SOS:') === 0) {\n      const parts = data.split(':');\n      acknowledgeEmergencySos('default-patient', parts[2] || 'user-admin', {\n        alertId: parts[1],\n        note: 'تأیید رویت از طریق دکمه شیشه‌ای بات تلگرام'\n      });\n    }\n  }\n  return { ok: true };\n}\n\nfunction safeJsonParse(str, fallback) {\n  if (!str) return fallback;\n  if (typeof str === 'object') return str;\n  try { return JSON.parse(str); } catch (e) { return fallback; }\n}\n\nfunction createHttpError(code, message) {\n  const err = new Error(message);\n  err.statusCode = code;\n  return err;\n}\n\nfunction handleException(err) {\n  const code = err.statusCode || 500;\n  return jsonResponse(code, {\n    ok: false,\n    statusCode: code,\n    error: err.message || 'خطای داخلی سرور Google Apps Script'\n  });\n}\n\nfunction jsonResponse(statusCode, payload) {\n  const envelope = Object.assign({ statusCode: statusCode, ok: statusCode >= 200 && statusCode < 300 }, payload);\n  return ContentService\n    .createTextOutput(JSON.stringify(envelope))\n    .setMimeType(ContentService.MimeType.JSON);\n}\n", "appsscript.json": "{\n  \"timeZone\": \"Asia/Tehran\",\n  \"dependencies\": {},\n  \"exceptionLogging\": \"STACKDRIVER\",\n  \"runtimeVersion\": \"V8\",\n  \"webapp\": {\n    \"executeAs\": \"USER_DEPLOYING\",\n    \"access\": \"ANYONE_ANONYMOUS\"\n  },\n  \"oauthScopes\": [\n    \"https://www.googleapis.com/auth/spreadsheets\",\n    \"https://www.googleapis.com/auth/drive\",\n    \"https://www.googleapis.com/auth/script.external_request\",\n    \"https://www.googleapis.com/auth/script.scriptapp\"\n  ]\n}\n", "manifest.json": "{\n  \"name\": \"CareSync Pro | همیار سلامت خانواده\",\n  \"short_name\": \"CareSync Pro\",\n  \"description\": \"پلتفرم هوشمند مدیریت و هماهنگی مراقبت بیمار در منزل (سلامت خانواده)\",\n  \"lang\": \"fa-IR\",\n  \"dir\": \"rtl\",\n  \"start_url\": \"./index.html\",\n  \"scope\": \"./\",\n  \"display\": \"standalone\",\n  \"orientation\": \"portrait-primary\",\n  \"background_color\": \"#0f172a\",\n  \"theme_color\": \"#0d9488\",\n  \"icons\": [\n    {\n      \"src\": \"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%230d9488'/%3E%3Cpath d='M96 44v104M44 96h104' stroke='%23fff' stroke-width='22' stroke-linecap='round'/%3E%3C/svg%3E\",\n      \"sizes\": \"192x192\",\n      \"type\": \"image/svg+xml\",\n      \"purpose\": \"any maskable\"\n    },\n    {\n      \"src\": \"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='108' fill='%230d9488'/%3E%3Cpath d='M256 116v280M116 256h280' stroke='%23fff' stroke-width='56' stroke-linecap='round'/%3E%3C/svg%3E\",\n      \"sizes\": \"512x512\",\n      \"type\": \"image/svg+xml\",\n      \"purpose\": \"any maskable\"\n    }\n  ]\n}\n", "sw.js": "const CACHE_NAME = 'caresync-pro-pwa-v2.4';\nconst ASSETS_TO_CACHE = [\n  './',\n  './index.html',\n  './manifest.json'\n];\n\nself.addEventListener('install', event => {\n  event.waitUntil(\n    caches.open(CACHE_NAME).then(cache => cache.addAll(ASSETS_TO_CACHE))\n  );\n  self.skipWaiting();\n});\n\nself.addEventListener('activate', event => {\n  event.waitUntil(\n    caches.keys().then(keys =>\n      Promise.all(keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k)))\n    )\n  );\n  self.clients.claim();\n});\n\nself.addEventListener('fetch', event => {\n  if (event.request.method !== 'GET') return;\n  event.respondWith(\n    caches.match(event.request).then(cached => {\n      return cached || fetch(event.request).catch(() => caches.match('./index.html'));\n    })\n  );\n});\n", "README.md": "# پلتفرم هوشمند مدیریت و هماهنگی مراقبت بیمار در منزل (CareSync Pro | همیار سلامت خانواده)\n\nاین مخزن حاوی پیاده‌سازی کامل، تجاری و آماده بهره‌برداری پلتفرم **CareSync Pro (همیار سلامت خانواده)** بر بستر **GitHub Pages (فرانت‌اند PWA)** و **Google Apps Script + Google Sheets + Google Drive (بک‌اند، دیتابیس ۱۶ جدوله و مخزن اسناد)** است.\n\n---\n\n## ۱. معماری و ساختار فایل‌های پروژه (Project Inventory)\n\n```text\ncaresync-pro/\n├── index.html                 # وب‌اپلیکیشن تک‌صفحه‌ای کامل (PWA) با فونت وزیرمتن، حالت سالمندان و ۸ ماژول کامل\n├── manifest.json              # مانیفست رسمی PWA جهت نصب روی موبایل (Add to Home Screen)\n├── sw.js                      # سرویس‌ورکر برای کش آفلاین روی GitHub Pages\n├── backend/\n│   ├── Code.gs                # کد کامل بک‌اند Google Apps Script (شامل ۱۶ جدول، RBAC، قفل تراکنش LockService و API)\n│   └── appsscript.json        # مانیفست تنظیمات و دسترسی‌های Google Apps Script\n├── tests/\n│   └── test_business_logic.js # تست‌های خودکار منطق تجاری (موجودی دارو، آستانه علائم حیاتی، قفل شیفت، لجستیک و تراز مالی)\n└── README.md                  # مستندات جامع نصب، راه‌اندازی و استقرار روی GitHub Pages و Google Apps Script\n```\n\n---\n\n## ۲. قابلیت‌های پیاده‌سازی‌شده منطبق بر سند ۲۵ صفحه‌ای\n\n1. **معماری Multi-Tenant بر پایه پرونده بیمار و ۶ نقش کاربری (RBAC Matrix):**\n   - پشتیبانی از چندین پرونده بیمار به‌صورت همزمان (مثلاً پدر و مادر خانواده).\n   - پیاده‌سازی کامل نقش‌های `CARE_ADMIN`، `FAMILY_MEMBER`، `PROCUREMENT_AGENT`، `NURSE`، `VIEWER_DOCTOR` و `SUPER_ADMIN` همراه با فلگ‌های دسترسی جزئی (`canManageAppointments`, `canManageMeds`, `canLogVitals`, `canManageShifts`, `canViewFinance`, `canUploadDocs`, `isDefaultPurchaser`).\n2. **طراحی ویژه موبایل، لپ‌تاپ و حالت اختصاصی سالمندان (Senior Accessibility Mode):**\n   - دارای دکمه **«👓 حالت سالمندان»** در نوار بالایی ثابت که با یک کلیک اندازه فونت‌ها، کنتراست کادرها و ارتفاع دکمه‌های لمسی را برای اعضای مسن‌تر خانواده بزرگ و خوانا می‌کند.\n   - واکنش‌گرا با نوار ناوبری پایین صفحه در موبایل (Bottom Bar) و سایدبار کامل در لپ‌تاپ + حالت شب و روز (Dark/Light Mode).\n3. **ماژول ۱ — داشبورد فرماندهی سلامت (`/dashboard`):**\n   - کارت خلاصه وضعیت بالینی و امتیاز سلامت (`1` تا `100`) همگام با آخرین معاینه پزشک.\n   - ویجت آخرین علائم حیاتی، ویجت شیفت فعال و بعدی + دکمه تحویل شیفت دیجیتال، هشدارهای فوری دارو و نوبت‌های پیش‌رو، و **تایم‌لاین جامع پیشرفت بالینی بیمار (Longitudinal Health Timeline)**.\n4. **ماژول ۲ — نوبت‌های پزشک، معاینات و لجستیک اعزام (`/appointments`):**\n   - پیاده‌سازی قانون سخت سیستم (**بخش ۸.۱.۲**): در صورت فعال بودن `requires_patient_presence = true`، تعیین روش حمل‌ونقل، ساعت حرکت از منزل و حداقل یک همراه الزامی است (`422 Unprocessable Entity`).\n   - چک‌لیست تعاملی تجهیزات همراه (ویلچر، کپسول اکسیژن، پرونده قبلی) و تأیید همراهی توسط فرزندان.\n5. **ماژول ۳ — نسخه‌ها، آزمایش‌ها و اقدامات پاراکلینیکی (`/medical-orders`):**\n   - برد کانبان ۳ ستونه و فیلترپذیر (`در انتظار انجام`، `نمونه‌گیری‌شده / در انتظار جواب`، `انجام‌شده و متصل به پرونده`) با تفکیک خدمات در منزل (`AT_HOME_SERVICE`) و مراجعه به کلینیک.\n6. **ماژول ۴ — داروخانه هوشمند و تدارکات خرید (`/medications-inventory`):**\n   - محاسبه خودکار روزهای باقی‌مانده: $\\text{Days Remaining} = \\lfloor \\frac{\\text{Current Stock}}{\\text{Daily Consumption Rate}} \\rfloor$.\n   - تغییر خودکار وضعیت به ۴ حالت (`NEWLY_PURCHASED`, `IN_STOCK`, `LOW_STOCK`, `OUT_OF_STOCK`)، جلوگیری از منفی شدن موجودی، و صدور **Idempotent** سفارش خرید برای مسئول تدارکات.\n   - پشتیبانی از سناریوی مرزی تغییر دوز دارو توسط پزشک در میانه دوره (**بخش ۸.۲.۳**) و ثبت خودکار فاکتور در حسابداری پس از خرید.\n7. **ماژول ۵ — علائم حیاتی و نمودارهای تحلیلی (`/vitals`):**\n   - فرم ثبت سریع چندگانه مجهز به **موتور ارزیاب محدوده مجاز (Threshold Evaluator)** و نمایش فوری بنر پیشنهاد ارسال هشدار اورژانسی SOS در صورت ثبت عدد بحرانی.\n   - نمودار سری زمانی تعاملی (`Chart.js`) با خطوط آستانه خطر و **نقاط تغییر دارو (Medication Overlay)**.\n8. **ماژول ۶ — تقویم شیفت‌ها، مرخصی و جابه‌جایی توافقی (`/shifts`):**\n   - رعایت قانون **عدم وجود شکاف بدون مراقب (Zero Unattended Shift Invariant)**: هیچ شیفتی حذف نمی‌شود؛ فقط درخواست جایگزین (`ABSENCE_REPLACEMENT`) یا جابه‌جایی توافقی دوطرفه (`MUTUAL_SWAP`) ثبت می‌گردد.\n   - استفاده از قفل تراکنش دیتابیس (`LockService` در Google Apps Script) برای جلوگیری از Race Condition هنگام کلیک همزمان دو فرزند روی دکمه پذیرش شیفت (`409 Conflict`).\n   - فرم تحویل شیفت دیجیتال ۳۰ ثانیه‌ای و نمودار عدالت توزیع ساعت شیفت بین فرزندان.\n9. **ماژول ۷ — آرشیو اسناد پزشکی تاریخی و حسابداری خانواده (`/finance-documents`):**\n   - بایگانی اسناد بر اساس **تاریخ واقعی مدرک پزشکی (`document_actual_date`)** با فیلتر سال، دسته‌بندی و جستجو.\n   - محاسبه خودکار هزینه خالص پس از کسر بازپرداخت بیمه تکمیلی و محاسبه **تراز مالی و سهم عادلانه هر عضو خانواده (بستانکار / بدهکار / تسویه)** + خروجی چاپی/PDF گزارش رسمی ویژه پزشک (`Clinical Handover PDF`).\n10. **ماژول ۸ — حلقه مراقبت، ماتریس RBAC، بات تلگرام و لاگ حسابرسی (`/care-circle`):**\n    - مدیریت اعضا و تولید لینک دعوت اختصاصی، شبیه‌ساز تعاملی دستورات بات تلگرام (`/status`, `/shift`, `/vitals`)، و **لاگ حسابرسی تغییرناپذیر (`Immutable Audit Trail`)**.\n\n---\n\n## ۳. راهنمای گام‌به‌گام استقرار روی Google Apps Script (بک‌اند و دیتابیس)\n\n1. وارد آدرس [script.google.com](https://script.google.com) شوید و روی **New Project** کلیک کنید.\n2. محتوای فایل `backend/Code.gs` را کپی کرده و در فایل `Code.gs` پروژه قرار دهید.\n3. از منوی سمت چپ وارد **Project Settings (⚙️)** شوید و تیک گزینه **«Show \"appsscript.json\" manifest file in editor»** را فعال کنید، سپس محتوای `backend/appsscript.json` را در آن کپی نمایید.\n4. در نوار ابزار بالای ادیتور، تابع `setupDatabase` را انتخاب کرده و یک بار دکمه **Run** را بزنید و دسترسی‌های Google Sheets و Google Drive را تأیید (Authorize) کنید. این کار به‌طور خودکار اسپردشیت دیتابیس را با **۱۷ شیت استاندارد** (`users`, `patients`, `care_circle_members`, `doctor_appointments`, `appointment_escorts`, `clinical_assessments`, `medical_orders`, `inventory_items`, `medication_consumption_logs`, `procurement_orders`, `vital_sign_logs`, `emergency_alerts`, `care_shifts`, `shift_change_requests`, `medical_documents`, `financial_invoices`, `audit_logs`) می‌سازد و داده‌های اولیه را مقداردهی می‌کند.\n5. برای فعال‌سازی جاب ساعتی بررسی موجودی دارو، از منوی سمت چپ وارد **Triggers (⏰)** شوید و یک تریگر Time-driven ساعتی برای تابع `runHourlyInventoryAndShiftWorker` بسازید.\n6. روی دکمه آبی **Deploy > New deployment** کلیک کنید:\n   - نوع (Select type) را روی **Web app** قرار دهید.\n   - گزینه **Execute as** را روی `Me` قرار دهید.\n   - گزینه **Who has access** را روی `Anyone` قرار دهید و روی **Deploy** کلیک کنید.\n7. لینک تولیدشده (`https://script.google.com/macros/s/.../exec`) را کپی کنید.\n\n---\n\n## ۴. راهنمای گام‌به‌گام استقرار روی GitHub Pages (فرانت‌اند PWA)\n\n1. یک مخزن (Repository) جدید در GitHub بسازید و فایل‌های `index.html`، `manifest.json` و `sw.js` را در ریشه (Root) مخزن آپلود و Commit کنید.\n2. وارد بخش **Settings > Pages** مخزن شوید، در قسمت **Build and deployment** شاخه `main` و پوشه `/ (root)` را انتخاب و روی **Save** کلیک کنید.\n3. پس از چند ثانیه، آدرس سایت شما روی `https://<username>.github.io/<repo-name>/` فعال می‌شود.\n4. سایت را باز کرده، در نوار بالایی روی دکمه **«سرور GAS / محلی»** کلیک کنید و لینک Web App دریافتی از Google Apps Script را وارد و ذخیره نمایید.\n\n---\n\n## ۵. تنظیم متغیرهای محیطی اختیاری در Google Apps Script (پیامک و بات تلگرام)\n\nدر صورت تمایل به اتصال واقعی درگاه پیامک کاوه‌نگار / ملی‌پیامک و بات تلگرام، در Google Apps Script وارد **Project Settings > Script Properties** شوید و کلیدهای زیر را اضافه کنید (در صورت عدم تعریف، سیستم به‌طور خودکار در حالت Sandbox امن کار می‌کند):\n\n| نام متغیر (Property) | توضیح |\n| :--- | :--- |\n| `SPREADSHEET_ID` | به صورت خودکار توسط `setupDatabase()` پر می‌شود |\n| `KAVENEGAR_API_KEY` | کلید API کاوه‌نگار برای ارسال پیامک اورژانسی خط خدماتی |\n| `MELIPAYAMAK_API_KEY` | کلید API ملی‌پیامک به عنوان درگاه پشتیبان (Dual-Provider Failover) |\n| `TELEGRAM_BOT_TOKEN` | توکن ربات تلگرام دریافتی از `@BotFather` |\n"};

    /* تبدیل تاریخ میلادی به شمسی (جلالی) خوانا */
    function toPersianDigits(val) {
      if (val === null || val === undefined) return '';
      const map = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
      return String(val).replace(/\d/g, d => map[Number(d)]);
    }

    function formatCurrencyToman(amount) {
      const n = Number(amount || 0);
      return toPersianDigits(n.toLocaleString('en-US')) + ' تومان';
    }

    function formatJalaliDate(isoOrDateStr, includeTime) {
      if (!isoOrDateStr) return '—';
      try {
        const d = new Date(isoOrDateStr);
        if (isNaN(d.getTime())) return toPersianDigits(isoOrDateStr);
        const datePart = new Intl.DateTimeFormat('fa-IR', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        }).format(d);
        if (!includeTime) return datePart;
        const timePart = new Intl.DateTimeFormat('fa-IR', {
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        }).format(d);
        return datePart + ' ساعت ' + timePart;
      } catch (e) {
        return toPersianDigits(isoOrDateStr);
      }
    }

    function formatShortJalali(isoOrDateStr) {
      if (!isoOrDateStr) return '—';
      try {
        const d = new Date(isoOrDateStr);
        if (isNaN(d.getTime())) return toPersianDigits(isoOrDateStr);
        return new Intl.DateTimeFormat('fa-IR', { month: 'short', day: 'numeric' }).format(d);
      } catch (e) {
        return toPersianDigits(isoOrDateStr);
      }
    }

    function loadAppState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const savedGasUrl = localStorage.getItem(GAS_URL_KEY) || '';
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.patients)) {
            parsed.gasWebAppUrl = savedGasUrl || parsed.gasWebAppUrl || '';
            return parsed;
          }
        }
      } catch (e) {}
      return buildInitialSeedState();
    }

    function saveAppState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        if (appState.gasWebAppUrl) {
          localStorage.setItem(GAS_URL_KEY, appState.gasWebAppUrl);
        }
      } catch (e) {}
    }

    function getOfflineQueue() {
      try {
        const raw = localStorage.getItem(OFFLINE_QUEUE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function pushOfflineQueue(actionItem) {
      try {
        const q = getOfflineQueue();
        q.push(Object.assign({ queuedAt: new Date().toISOString() }, actionItem));
        localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q));
        updateOfflineQueueBadge();
      } catch (e) {}
    }

    function clearOfflineQueue() {
      try {
        localStorage.removeItem(OFFLINE_QUEUE_KEY);
        updateOfflineQueueBadge();
      } catch (e) {}
    }

    /**
     * بررسی دقیق مجوز بر اساس ماتریس RBAC بخش ۲.۲ سند
     */
    function canPerform(capability) {
      const member = getActiveMemberRecord();
      const role = member.role;
      const perms = member.permissions || {};

      switch (capability) {
        case 'EDIT_PATIENT_PROFILE':
        case 'MANAGE_RBAC_MEMBERS':
        case 'GENERATE_SHIFT_SCHEDULE':
          return role === 'CARE_ADMIN' || role === 'SUPER_ADMIN' || Boolean(perms.canManageShifts);

        case 'CREATE_APPOINTMENT':
          return role === 'CARE_ADMIN' || role === 'FAMILY_MEMBER' || Boolean(perms.canManageAppointments);

        case 'RECORD_ASSESSMENT':
          return ['CARE_ADMIN', 'FAMILY_MEMBER', 'NURSE', 'VIEWER_DOCTOR'].includes(role);

        case 'CREATE_MEDICAL_ORDER':
          return ['CARE_ADMIN', 'FAMILY_MEMBER', 'VIEWER_DOCTOR'].includes(role);

        case 'MARK_ORDER_DONE':
          return ['CARE_ADMIN', 'FAMILY_MEMBER', 'NURSE', 'VIEWER_DOCTOR'].includes(role);

        case 'DEFINE_MEDICATION':
          return ['CARE_ADMIN', 'FAMILY_MEMBER', 'PROCUREMENT_AGENT'].includes(role) || Boolean(perms.canManageMeds);

        case 'LOG_DOSE_AND_VITALS':
          return ['CARE_ADMIN', 'FAMILY_MEMBER', 'NURSE', 'PROCUREMENT_AGENT'].includes(role) || Boolean(perms.canLogVitals);

        case 'RESTOCK_PURCHASE':
          return ['CARE_ADMIN', 'FAMILY_MEMBER', 'PROCUREMENT_AGENT'].includes(role) || Boolean(perms.isDefaultPurchaser);

        case 'TRIGGER_SOS':
          return ['CARE_ADMIN', 'FAMILY_MEMBER', 'NURSE', 'PROCUREMENT_AGENT'].includes(role);

        case 'SHIFT_SWAP_OR_CLAIM':
          return ['CARE_ADMIN', 'FAMILY_MEMBER', 'NURSE', 'PROCUREMENT_AGENT'].includes(role);

        case 'UPLOAD_DOCUMENT':
          return ['CARE_ADMIN', 'FAMILY_MEMBER', 'PROCUREMENT_AGENT', 'NURSE'].includes(role) || Boolean(perms.canUploadDocs);

        case 'VIEW_FINANCE_LEDGER':
          return ['CARE_ADMIN', 'FAMILY_MEMBER', 'PROCUREMENT_AGENT'].includes(role) || Boolean(perms.canViewFinance);

        case 'CREATE_INVOICE':
          return ['CARE_ADMIN', 'FAMILY_MEMBER', 'PROCUREMENT_AGENT', 'NURSE'].includes(role);

        default:
          return role === 'CARE_ADMIN';
      }
    }

    function showToast(title, subtitle, variant) {

      if (!container) return;
      const colors = {

        warning: 'bg-amber-500 border-amber-300 text-slate-950',
        error: 'bg-red-600 border-red-400 text-white',

      };
      const iconMap = {
        success: '✅',
        warning: '⚠️',
        error: '🚨',
        info: 'ℹ️'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto rounded-2xl border-2 px-4 py-3 shadow-xl transition-all duration-300 flex items-start gap-2.5 ${colors[variant || 'success']}`;
      el.innerHTML = `
        <span class="text-lg leading-none mt-0.5">${iconMap[variant || 'success']}</span>

          ${subtitle ? `<p class="mt-0.5 opacity-95 leading-relaxed">${subtitle}</p>` : ''}

      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';

      }, 4200);
    }

    /* ============================================================================
     * ارتباط با سرور Google Apps Script (Live Sync + Offline Queue Fallback)
     * ============================================================================ */
    async function dispatchBackendAction(actionName, payload) {
      if (appState.simulatedOffline) {
        pushOfflineQueue({ action: actionName, patientId: appState.activePatientId, userId: appState.activeUserId, payload: payload });
        showToast(
          'ذخیره در صف آفلاین (localStorage)',
          'به دلیل قطعی اینترنت، رکورد در حافظه امن دستگاه ذخیره شد و به‌محض اتصال شبکه به Google Apps Script ارسال می‌شود.',
          'warning'
        );
        return { offlineQueued: true };
      }

      if (!appState.gasWebAppUrl) {
        return { localMode: true };
      }

      try {
        const res = await fetch(appState.gasWebAppUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: actionName,
            patientId: appState.activePatientId,
            userId: appState.activeUserId,
            payload: payload
          })
        });
        const data = await res.json();
        appState.lastSyncedAt = new Date().toISOString();
        saveAppState();
        updateHeaderBar();
        return data;
      } catch (err) {
        pushOfflineQueue({ action: actionName, patientId: appState.activePatientId, userId: appState.activeUserId, payload: payload });
        showErrorBanner('عدم دسترسی موقت به سرور Google Apps Script (کد: NET_ERR_GAS)', 'تغییرات شما در حافظه محلی ذخیره شد. می‌توانید با دکمه تلاش مجدد همگام‌سازی کنید.');
        return { error: err.message, offlineQueued: true };
      }
    }

      box.classList.remove('hidden');
    }

    }

      // ۳. نشانگر وضعیت سلامت در هدر

          `;
        }
      }

      // ۴. نقش کاربر فعال
      const rolePill = document.getElementById('currentRolePill');
      if (rolePill) {
        rolePill.textContent = ROLE_LABELS[member.role] || 'سرپرست پرونده';
      }

      // ۵. وضعیت اتصال GAS
      const gasDot = document.getElementById('gasStatusDot');
      const gasText = document.getElementById('gasStatusText');
      if (gasDot && gasText) {
        if (appState.simulatedOffline) {
          gasDot.className = 'w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping';
          gasText.textContent = 'حالت آفلاین';

          gasText.textContent = 'متصل به سرور GAS';

          gasDot.className = 'w-2.5 h-2.5 rounded-full bg-teal-500';
          gasText.textContent = 'اتصال GAS و دانلود کدها';
        }

      // ۶. دکمه حالت سالمندان و شب

      if (seniorLabel) {
        seniorLabel.textContent = appState.seniorMode ? 'حالت سالمندان: روشن' : 'حالت سالمندان: خاموش';
      }
      document.documentElement.classList.toggle('senior-mode', Boolean(appState.seniorMode));
      document.documentElement.classList.toggle('dark', Boolean(appState.darkMode));

      // ۷. بج اعلان‌ها و سایدبار (فقط عدد، بدون شکستگی خط، و مخفی در حالت صفر)
      const unreadCount = appState.notifications.filter(n => n.unread).length;
      const notifBadge = document.getElementById('notifBadgeCount');
      if (notifBadge) {
        notifBadge.textContent = toPersianDigits(unreadCount);
        notifBadge.classList.toggle('hidden', unreadCount === 0);

      const aptCount = hasPatient ? appState.doctorAppointments.filter(a => a.patient_id === pId && a.status !== 'COMPLETED' && a.status !== 'CANCELLED').length : 0;
      const ordCount = hasPatient ? appState.medicalOrders.filter(o => o.patient_id === pId && o.status !== 'COMPLETED').length : 0;

      const openShiftReqCount = hasPatient ? appState.shiftChangeRequests.filter(r => r.patient_id === pId && r.status === 'PENDING_APPROVAL').length : 0;

        </div>

    function renderFinanceDocumentsView() {
      const patient = getActivePatient();
      const pId = patient.id;

      // فیلتر آرشیو اسناد پزشکی بر اساس سال، نوع سند و جستجو
      let docs = appState.medicalDocuments
        .filter(d => d.patient_id === pId)
        .sort((a, b) => String(b.document_actual_date).localeCompare(String(a.document_actual_date)));

      if (appState.docsCategoryFilter !== 'ALL') {
        docs = docs.filter(d => d.category === appState.docsCategoryFilter);
      }
      if (appState.docsYearFilter !== 'ALL') {
        docs = docs.filter(d => String(d.actual_jalali_year || '') === String(appState.docsYearFilter));
      }
      if (appState.docsSearchQuery) {
        const q = appState.docsSearchQuery.trim().toLowerCase();
        docs = docs.filter(d =>
          String(d.title).toLowerCase().includes(q) ||
          String(d.description_tags || '').toLowerCase().includes(q)

      const invoices = appState.financialInvoices.filter(i => i.patient_id === pId);

      // اعضای مشارکت‌کننده در هزینه‌های خانواده (همسر و ۵ فرزند)
      const familyContributors = appState.careCircleMembers.filter(
        m => m.patient_id === pId && ['CARE_ADMIN', 'FAMILY_MEMBER', 'PROCUREMENT_AGENT'].includes(m.role)

        INSURANCE_DOC: '🛡️ مدارک و معرفی‌نامه بیمه',

      };

      return `

    function initFinanceCategoryChart() {
      const canvas = document.getElementById('financeCategoryCanvas');
      if (!canvas || typeof Chart === 'undefined') return;
      if (activeFinanceCategoryChart) {
        activeFinanceCategoryChart.destroy();
        activeFinanceCategoryChart = null;
      }

      const invoices = appState.financialInvoices.filter(i => i.patient_id === appState.activePatientId);
      const catMap = {
        NURSING_CARE: { label: 'پرستاری در منزل', sum: 0, color: '#0d9488' },
        MEDICATION: { label: 'داروخانه', sum: 0, color: '#3b82f6' },
        MEDICAL_SUPPLIES: { label: 'تجهیزات و فیزیوتراپی', sum: 0, color: '#f59e0b' },
        LAB_AND_IMAGING: { label: 'آزمایش و تصویربرداری', sum: 0, color: '#8b5cf6' }
      };

      invoices.forEach(i => {
        const key = catMap[i.expense_category] ? i.expense_category : 'MEDICAL_SUPPLIES';
        catMap[key].sum += Number(i.amount || 0);
      });

      const vals = Object.values(catMap);
      activeFinanceCategoryChart = new Chart(canvas.getContext('2d'), {
        type: 'doughnut',
        data: {
          labels: vals.map(v => v.label),
          datasets: [{
            data: vals.map(v => v.sum),
            backgroundColor: vals.map(v => v.color)
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { font: { family: 'Vazirmatn', size: 11 } } }
          }
        }
      });
    }

    /* ============================================================================
     * مودال‌های عملیاتی و فرم‌های تعاملی (Interactive Modals & Business Rules)
     * ============================================================================ */

    function openModal(htmlContent) {
      const backdrop = document.getElementById('modalBackdrop');
      const box = document.getElementById('modalContentBox');
      if (!backdrop || !box) return;
      box.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
    }

    function closeModal() {
      const backdrop = document.getElementById('modalBackdrop');
      if (backdrop) backdrop.classList.add('hidden');
    }

    /* ============================================================================
     * مدیریت رویدادها و تعاملات سراسری (Global Event Delegation)
     * ============================================================================ */

    document.addEventListener('click', e => {
      // ۱. ناوبری سایدبار و موبایل
      const navBtn = e.target.closest('[data-nav]');
      if (navBtn) {
        appState.currentView = navBtn.getAttribute('data-nav');
        saveAppState();
        renderActiveView();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      const jumpBtn = e.target.closest('[data-nav-jump]');
      if (jumpBtn) {
        appState.currentView = jumpBtn.getAttribute('data-nav-jump');
        saveAppState();
        renderActiveView();
        return;
      }

      // ۲. تب‌های داخلی ماژول‌ها
      const aptTab = e.target.closest('[data-apt-tab]');
      if (aptTab) {
        appState.appointmentsSubTab = aptTab.getAttribute('data-apt-tab');
        renderActiveView();
        return;
      }

      const invTab = e.target.closest('[data-inv-tab]');
      if (invTab) {
        appState.inventorySubTab = invTab.getAttribute('data-inv-tab');
        renderActiveView();
        return;
      }

      const finTab = e.target.closest('[data-fin-tab]');
      if (finTab) {
        appState.financeSubTab = finTab.getAttribute('data-fin-tab');
        renderActiveView();
        return;
      }

      const ccTab = e.target.closest('[data-cc-tab]');
      if (ccTab) {
        appState.careCircleSubTab = ccTab.getAttribute('data-cc-tab');
        renderActiveView();
        return;
      }

      // ۳. اکشن‌های دکمه‌ها (data-action)
      const actBtn = e.target.closest('[data-action]');
      if (!actBtn) return;
      const action = actBtn.getAttribute('data-action');

      switch (action) {
        case 'toggleSettingsDrawer': {
          const drw = document.getElementById('settingsTopDrawer');
          if (drw) drw.classList.toggle('hidden');
          break;
        }
        case 'closeModal':
          closeModal();
          break;

        case 'openEditPatientModal':
        case 'openNewPatientModal':
          openNewPatientModal();
          break;

        case 'openHandoverPdfModal':
          openHandoverPdfModal();
          break;

        case 'printClinicalHandover':
          window.print();
          showToast('آماده چاپ / ذخیره PDF', 'پنجره رسمی چاپ گزارش پزشک باز شد.', 'info');
          break;

        case 'openQuickVitalsModal':
          appState.currentView = 'vitals';
          renderActiveView();
          break;

        case 'openNewAppointmentModal':
          openNewAppointmentModal();
          break;

        case 'openNewAssessmentModal':
          openNewAssessmentModal();
          break;

        case 'confirmEscortRole': {
          const escId = actBtn.getAttribute('data-escort-id');
          const esc = appState.appointmentEscorts.find(x => x.id === escId);
          if (esc) {
            esc.confirmation_status = 'ACCEPTED';
            recordAuditLog('CONFIRM_ESCORT', 'appointment_escorts', escId, 'تأیید همراهی برای بردن بیمار به مطب پزشک');
            saveAppState();
            renderActiveView();
            showToast('همراهی شما تأیید شد', 'وضعیت همراهی شما در لجستیک نوبت دکتر ثبت شد.', 'success');
          }
          break;
        }

        case 'openNewOrderModal':
          openNewOrderModal();
          break;

        case 'advanceMedicalOrder': {
          const ordId = actBtn.getAttribute('data-order-id');
          const nextSt = actBtn.getAttribute('data-next-status');
          const ord = appState.medicalOrders.find(o => o.id === ordId);
          if (ord) {
            ord.status = nextSt;
            saveAppState();
            renderActiveView();
            showToast('وضعیت آزمایش بروزرسانی شد', 'به ستون «نمونه‌گیری‌شده / در انتظار جواب» منتقل گردید.', 'success');
          }
          break;
        }

        case 'openCompleteOrderModal':
          openCompleteOrderModal(actBtn.getAttribute('data-order-id'));
          break;

        case 'openNewInventoryModal':
          openNewInventoryModal();
          break;

        case 'consumeDoseNow': {
          const itemId = actBtn.getAttribute('data-item-id');
          const st = actBtn.getAttribute('data-status') || 'TAKEN';
          handleConsumeMedication(itemId, st);
          break;
        }

        case 'openRestockModal':
          openRestockModal(actBtn.getAttribute('data-item-id'));
          break;

        case 'openChangeDoseModal':
          openChangeDoseModal(actBtn.getAttribute('data-item-id'));
          break;

        case 'fillCriticalVitalDemo': {
          const spo2Inp = document.getElementById('inpSpo2');
          const sysInp = document.getElementById('inpSysBp');
          if (spo2Inp) spo2Inp.value = '85';
          if (sysInp) sysInp.value = '172';
          showToast('مقادیر بحرانی جایگذاری شد', 'اکنون دکمه «ثبت علائم حیاتی» را بزنید تا بنر پیشنهاد فوری SOS ظاهر شود.', 'warning');
          break;
        }

        case 'openSosModalFromVital':
          openSosModal('افت شدید اکسیژن خون به ۸۵٪ و فشار خون بحرانی ۱۷۲');
          break;

        case 'openShiftHandoverModal':
          openShiftHandoverModal(actBtn.getAttribute('data-shift-id'));
          break;

        case 'checkInNextShift': {
          const shId = actBtn.getAttribute('data-shift-id');
          const sh = appState.careShifts.find(s => s.id === shId);
          if (sh) {
            appState.careShifts.forEach(s => { if (s.patient_id === appState.activePatientId && s.status === 'IN_PROGRESS') s.status = 'COMPLETED'; });
            sh.status = 'IN_PROGRESS';
            recordAuditLog('SHIFT_CHECK_IN', 'care_shifts', shId, 'تحویل گرفتن و شروع شیفت جدید: ' + sh.shift_title);
            saveAppState();
            renderActiveView();
            showToast('شیفت تحویل گرفته شد ✅', `هم‌اکنون «${sh.shift_title}» به عنوان شیفت فعال ثبت گردید.`, 'success');
          }
          break;
        }

        case 'openLeaveRequestModal':
          openLeaveRequestModal(actBtn.getAttribute('data-shift-id'));
          break;

        case 'openMutualSwapModal':
          openMutualSwapModal(actBtn.getAttribute('data-shift-id'));
          break;

        case 'openGenerateShiftsModal':
          openGenerateShiftsModal();
          break;

        case 'claimShiftReplacement': {
          const reqId = actBtn.getAttribute('data-request-id');
          handleClaimShiftReplacement(reqId);
          break;
        }

        case 'acceptMutualSwap': {
          const reqId = actBtn.getAttribute('data-request-id');
          handleRespondMutualSwap(reqId, 'ACCEPT');
          break;
        }

        case 'rejectMutualSwap': {
          const reqId = actBtn.getAttribute('data-request-id');
          handleRespondMutualSwap(reqId, 'REJECT');
          break;
        }

        case 'simulateRaceConditionConflict': {
          showToast(
            'خطای ۴۰۹ (409 Conflict - Pessimistic Lock)',
            'این شیفت چند لحظه پیش توسط «عضو دیگر خانواده» پذیرفته شد! قفل تراکنش دیتابیس (SELECT FOR UPDATE / LockService) از ثبت همزمان جلوگیری کرد.',
            'error'
          );
          break;
        }

        case 'openUploadDocumentModal':
          openUploadDocumentModal();
          break;

        case 'previewMedicalDocument': {
          const docId = actBtn.getAttribute('data-doc-id');
          const doc = appState.medicalDocuments.find(d => d.id === docId);
          if (doc) {
            openModal(`
              <div class="space-y-4 text-xs">
                <div class="flex items-center justify-between border-b pb-3">
                  <h3 class="text-base font-black">👁️ پیش‌نمایش امن سند پزشکی (Presigned URL)</h3>
                  <button type="button" data-action="closeModal" class="p-1.5 font-bold">✕</button>
                </div>
                <div class="p-5 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 space-y-2">
                  <p class="font-black text-sm">${doc.title}</p>
                  <p><strong>نام فایل:</strong> ${doc.file_name} • <strong>تاریخ واقعی مدرک:</strong> ${formatJalaliDate(doc.document_actual_date, false)}</p>
                  <p><strong>کلید مخزن ابری:</strong> <code class="font-mono">${doc.file_storage_key}</code></p>
                  <p class="text-emerald-700 dark:text-emerald-300 font-bold mt-2">🔒 لینک موقت امضاشده با اعتبار ۱۵ دقیقه تولید شد.</p>
                </div>
                <div class="flex justify-end">
                  <button type="button" data-action="closeModal" class="px-4 py-2 rounded-xl bg-teal-600 text-white font-bold">بستن پیش‌نمایش</button>
                </div>
              </div>
            `);
          }
          break;
        }

        case 'openNewInvoiceModal':
          openNewInvoiceModal();
          break;

        case 'markInvoiceReimbursed': {
          const invId = actBtn.getAttribute('data-invoice-id');
          const inv = appState.financialInvoices.find(i => i.id === invId);
          if (inv) {
            inv.insurance_claim_status = 'REIMBURSED';
            inv.reimbursed_amount = Math.round(Number(inv.amount || 0) * 0.75);
            recordAuditLog('INSURANCE_REIMBURSED', 'financial_invoices', invId, 'ثبت بازپرداخت ۷۵٪ بیمه تکمیلی برای فاکتور: ' + inv.title);
            saveAppState();
            renderActiveView();
            showToast('بازپرداخت بیمه تکمیلی ثبت شد', 'تراز مالی اعضای خانواده به‌طور خودکار بروزرسانی گردید.', 'success');
          }
          break;
        }

        case 'openAddMemberModal':
          openAddMemberModal();
          break;

        case 'copyInviteLink': {
          const memId = actBtn.getAttribute('data-member-id');
          const token = 'https://caresync-pro.github.io/?invite=INV-' + String(memId).toUpperCase();
          try {
            navigator.clipboard.writeText(token);
          } catch (err) {}
          showToast('لینک دعوت اختصاصی کپی شد 🔗', 'لینک دعوت تلگرامی/پیامکی با توکن یکتا در کلیپ‌بورد کپی شد.', 'info');
          break;
        }

        case 'sendTelegramCmd': {
          const cmd = actBtn.getAttribute('data-cmd');
          handleTelegramBotCommand(cmd);
          break;
        }

        case 'rechargeSmsWallet': {
          appState.smsWalletBalance = Number(appState.smsWalletBalance || 485) + 100;
          saveAppState();
          renderActiveView();
          showToast('کیف پول پیامک اورژانسی شارژ شد', '۱۰۰ پیامک خدماتی جدید به اعتبار حساب خانواده اضافه شد.', 'success');
          break;
        }

        
        case 'downloadBackendFile': {
          const fname = actBtn.getAttribute('data-file');
          const content = EMBEDDED_PROJECT_FILES[fname] || '';
          const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fname;
          document.body.appendChild(a);
          a.click();
          setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 200);
          showToast('فایل آماده دانلود شد ⬇️', fname + ' با موفقیت دریافت گردید.', 'success');
          break;
        }

        case 'saveGasWebAppUrl': {
          const inp = document.getElementById('inpGasWebAppUrl');
          appState.gasWebAppUrl = inp ? inp.value.trim() : '';
          saveAppState();
          closeModal();
          updateHeaderBar();
          showToast('تنظیمات سرور ذخیره شد', appState.gasWebAppUrl ? 'اتصال به Google Apps Script فعال شد.' : 'حالت مستقل مرورگر فعال است.', 'success');
          break;
        }

        case 'flushOfflineQueueNow': {
          const q = getOfflineQueue();
          clearOfflineQueue();
          closeModal();
          showToast('صف آفلاین همگام‌سازی شد ✅', `${toPersianDigits(q.length)} رکورد ذخیره شده با موفقیت به سرور ارسال گردید.`, 'success');
          break;
        }

        case 'resetDemoDatabase': {
          localStorage.removeItem(STORAGE_KEY);
          appState = buildInitialSeedState();
          saveAppState();
          closeModal();
          renderActiveView();
          showToast('داده‌های نمونه بازنشانی شد', 'تمامی ۱۶ جدول به وضعیت اولیه سناریوی خانواده بازگشتند.', 'info');
          break;
        }
      }
    });

    /* رویدادهای تغییر (Change Events) برای فیلترها، چک‌باکس‌ها و سلکت‌ها */
    document.addEventListener('change', e => {
      const t = e.target;

      if (t.id === 'patientSelect') {
        appState.activePatientId = t.value;
        saveAppState();
        renderActiveView();
        showToast('پرونده بیمار تغییر کرد', 'داشبورد و علائم حیاتی بیمار انتخاب‌شده بارگذاری شد.', 'info');
        return;
      }

      if (t.id === 'activeUserSelect') {
        appState.activeUserId = t.value;
        saveAppState();
        renderActiveView();
        const u = getActiveUser();
        const m = getActiveMemberRecord();
        showToast('تغییر نقش کاربری (RBAC)', `اکنون با دسترسی «${u.full_name}» (${m.role}) در حال مشاهده پنل هستید.`, 'info');
        return;
      }

      if (t.id === 'orderTypeFilterSelect') {
        appState.ordersFilterType = t.value;
        renderActiveView();
        return;
      }

      if (t.id === 'vitalsMetricSelect') {
        appState.vitalsChartMetric = t.value;
        initVitalsAnalyticsChart();
        return;
      }

      if (t.id === 'selDocsCategory') {
        appState.docsCategoryFilter = t.value;
        renderActiveView();
        return;
      }

      if (t.id === 'selDocsYear') {
        appState.docsYearFilter = t.value;
        renderActiveView();
        return;
      }

      if (t.id === 'chkRequiresPresence') {
        const box = document.getElementById('logisticsFieldsBox');
        if (box) box.classList.toggle('hidden', !t.checked);
        return;
      }

      const action = t.getAttribute('data-action');
      if (action === 'toggleAppointmentEquipment') {
        const aptId = t.getAttribute('data-apt-id');
        const idx = Number(t.getAttribute('data-eq-idx'));
        const apt = appState.doctorAppointments.find(a => a.id === aptId);
        if (apt && Array.isArray(apt.required_equipment_checklist) && apt.required_equipment_checklist[idx]) {
          apt.required_equipment_checklist[idx].checked = t.checked;
          saveAppState();
          renderActiveView();
        }
      } else if (action === 'changeAppointmentLifecycle') {
        const aptId = t.getAttribute('data-apt-id');
        const apt = appState.doctorAppointments.find(a => a.id === aptId);
        if (apt) {
          apt.status = t.value;
          saveAppState();
          renderActiveView();
          showToast('وضعیت نوبت دکتر تغییر کرد', `وضعیت جدید: ${t.value}`, 'success');
        }
      } else if (action === 'toggleMemberPerm') {
        const memId = t.getAttribute('data-member-id');
        const permKey = t.getAttribute('data-perm');
        const mem = appState.careCircleMembers.find(m => m.id === memId);
        if (mem) {
          mem.permissions = mem.permissions || {};
          mem.permissions[permKey] = t.checked;
          recordAuditLog('UPDATE_MEMBER_PERMISSION', 'care_circle_members', memId, `تغییر مجوز ${permKey} برای ${getUserById(mem.user_id).full_name}`);
          saveAppState();
          showToast('سطح دسترسی بروزرسانی شد', 'تغییر در ماتریس مجوزهای عضو ذخیره گردید.', 'success');
        }
      }
    });

    document.addEventListener('input', e => {
      if (e.target && e.target.id === 'inpDocsSearch') {
        appState.docsSearchQuery = e.target.value;
        renderActiveView();
        const inp = document.getElementById('inpDocsSearch');
        if (inp) {
          inp.focus();
          inp.setSelectionRange(inp.value.length, inp.value.length);
        }
      }
    });

    /* ============================================================================
     * پردازش فرم‌ها و قوانین تجاری (Form Submissions & Business Logic Handlers)
     * ============================================================================ */

    document.addEventListener('submit', e => {
      e.preventDefault();
      const form = e.target;

      // ۱. ثبت سریع علائم حیاتی + ارزیاب آستانه خطر (بخش ۵ و ۷.۵)
      if (form.id === 'vitalsQuickForm') {
        const fd = new FormData(form);
        const sys = Number(fd.get('systolicBp'));
        const dia = Number(fd.get('diastolicBp'));
        const spo2 = Number(fd.get('spo2'));
        const hr = Number(fd.get('heartRate'));
        const glu = Number(fd.get('bloodGlucose'));
        const ctx = fd.get('glucoseContext');
        const temp = Number(fd.get('bodyTemperature'));
        const pain = Number(fd.get('painLevel') || 0);
        const notes = fd.get('clinicalNotes');

        const patient = getActivePatient();
        const t = patient.vital_thresholds || { systolicMax: 145, systolicCritical: 165, spo2Min: 92, spo2Critical: 88, glucoseFastingMax: 130, glucoseCritical: 220 };

        let status = 'NORMAL';
        const reasons = [];
        if (spo2 < t.spo2Critical || sys >= t.systolicCritical || dia >= 105 || glu >= t.glucoseCritical || pain >= 8) {
          status = 'CRITICAL';
          if (spo2 < t.spo2Critical) reasons.push(`افت بحرانی اکسیژن خون (${toPersianDigits(spo2)}٪ < ${toPersianDigits(t.spo2Critical)}٪)`);
          if (sys >= t.systolicCritical) reasons.push(`فشار خون بحرانی (${toPersianDigits(sys)}/${toPersianDigits(dia)})`);
        } else if (spo2 < t.spo2Min || sys >= t.systolicMax || glu >= t.glucoseFastingMax) {
          status = 'WARNING';
        }

        const newLog = {
          id: 'vit-' + Date.now().toString(36),
          patient_id: patient.id,
          recorded_by_user_id: appState.activeUserId,
          measured_at: new Date().toISOString(),
          systolic_bp: sys,
          diastolic_bp: dia,
          heart_rate: hr,
          spo2: spo2,
          blood_glucose: glu,
          glucose_context: ctx,
          body_temperature: temp,
          respiratory_rate: 16,
          pain_level: pain,
          abnormality_status: status,
          clinical_notes: notes
        };

        appState.vitalSignLogs.push(newLog);
        recordAuditLog('LOG_VITALS', 'vital_sign_logs', newLog.id, `ثبت علائم حیاتی: فشار ${sys}/${dia}، اکسیژن ${spo2}% (${status})`);
        saveAppState();
        dispatchBackendAction('logVitalSigns', newLog);
        renderActiveView();

        if (status === 'CRITICAL') {
          const banner = document.getElementById('vitalCriticalSosSuggestion');
          const reasonEl = document.getElementById('vitalCriticalReasonText');
          if (banner && reasonEl) {
            reasonEl.textContent = reasons.join(' • ');
            banner.classList.remove('hidden');
          }
          showToast('هشدار بحرانی علائم حیاتی!', reasons.join(' - '), 'error');
        } else {
          showToast('علائم حیاتی ثبت شد ✅', 'نمودار سری زمانی و کارت وضعیت بیمار بروزرسانی شد.', 'success');
        }
        return;
      }

      // ۲. فرم اعلام وضعیت اورژانسی SOS
      if (form.id === 'formEmergencySos') {
        const fd = new FormData(form);
        const newAlert = {
          id: 'sos-' + Date.now().toString(36),
          patient_id: appState.activePatientId,
          triggered_by_user_id: appState.activeUserId,
          severity: fd.get('severity'),
          reason_title: fd.get('reasonTitle'),
          details: fd.get('details'),
          destination_hospital: fd.get('destinationHospital'),
          status: 'ACTIVE_EMERGENCY',
          acknowledged_by_users: [{ userId: appState.activeUserId, acknowledgedAt: new Date().toISOString(), note: 'ثبت‌کننده هشدار در کنار بیمار' }],
          triggered_at: new Date().toISOString(),
          resolved_at: null
        };
        appState.emergencyAlerts.unshift(newAlert);
        const patient = getActivePatient();
        patient.current_health_status = 'CRITICAL';
        appState.smsWalletBalance = Math.max(0, Number(appState.smsWalletBalance || 485) - 7);
        pushNotification('SMS + Telegram SOS', '🚨 هشدار اورژانسی SOS شلیک شد', `${newAlert.reason_title} — مقصد: ${newAlert.destination_hospital}`);
        recordAuditLog('TRIGGER_SOS', 'emergency_alerts', newAlert.id, 'شلیک هشدار اورژانسی چندکاناله SOS: ' + newAlert.reason_title);
        saveAppState();
        dispatchBackendAction('triggerEmergencySos', newAlert);
        closeModal();
        renderActiveView();
        showToast('🚨 هشدار اورژانسی SOS ارسال شد', 'پیامک خدماتی و اعلان تلگرام به تمام اعضای خانواده شلیک شد.', 'error');
        return;
      }

      // ۳. فرم ثبت نوبت دکتر (با اعتبارسنجی ۴۲۲ لجستیک)
      if (form.id === 'formNewAppointment') {
        const fd = new FormData(form);
        const reqPresence = document.getElementById('chkRequiresPresence').checked;
        const transport = fd.get('transportMethod');
        const depTime = fd.get('departureDatetime');
        const escortId = fd.get('primaryEscortUserId');

        if (reqPresence && (!transport || !depTime || !escortId)) {
          const errBox = document.getElementById('aptValidationError');
          if (errBox) {
            errBox.textContent = 'خطای ۴۲۲ (Unprocessable Entity): با توجه به الزام حضور فیزیکی بیمار، تعیین روش حمل‌ونقل، ساعت حرکت از منزل و حداقل یک همراه الزامی است.';
            errBox.classList.remove('hidden');
          }
          return;
        }

        const eqCsv = String(fd.get('equipmentCsv') || '').split('،').map(s => s.trim()).filter(Boolean);
        const aptId = 'apt-' + Date.now().toString(36);
        const newApt = {
          id: aptId,
          patient_id: appState.activePatientId,
          created_by_user_id: appState.activeUserId,
          doctor_name: fd.get('doctorName'),
          specialty: fd.get('specialty'),
          clinic_name_and_address: fd.get('clinicNameAndAddress'),
          clinic_phone: fd.get('clinicPhone'),
          appointment_datetime: new Date(fd.get('appointmentDatetime')).toISOString(),
          visit_reason: fd.get('visitReason'),
          requires_patient_presence: reqPresence,
          transport_method: reqPresence ? transport : 'NONE_PROXY_ONLY',
          vehicle_owner_or_details: fd.get('vehicleOwnerOrDetails') || 'هماهنگ‌شده',
          departure_datetime: reqPresence && depTime ? new Date(depTime).toISOString() : '',
          required_equipment_checklist: eqCsv.map(item => ({ item: item, checked: false })),
          logistics_instructions: '',
          status: 'SCHEDULED'
        };

        appState.doctorAppointments.unshift(newApt);
        if (escortId) {
          appState.appointmentEscorts.push({
            id: 'esc-' + Date.now().toString(36),
            appointment_id: aptId,
            member_user_id: escortId,
            escort_role: reqPresence ? 'DRIVER' : 'PROXY_REPRESENTATIVE',
            confirmation_status: 'PENDING',
            notes: ''
          });
        }
        recordAuditLog('CREATE_APPOINTMENT', 'doctor_appointments', aptId, 'ثبت نوبت جدید دکتر ' + newApt.doctor_name);
        saveAppState();
        dispatchBackendAction('createAppointment', newApt);
        closeModal();
        renderActiveView();
        showToast('نوبت پزشک و لجستیک ثبت شد ✅', 'یادآور اختصاصی برای همراهان ارسال گردید.', 'success');
        return;
      }

      // ۴. فرم ثبت نتیجه معاینه پزشک
      if (form.id === 'formNewAssessment') {
        const fd = new FormData(form);
        const patient = getActivePatient();
        const score = Number(fd.get('healthScore'));
        const status = fd.get('healthStatus');
        const mobility = fd.get('mobilityStatus');
        const diag = fd.get('activeProblemsDiagnosis');
        const rec = fd.get('doctorRecommendations');

        const newAss = {
          id: 'ass-' + Date.now().toString(36),
          patient_id: patient.id,
          appointment_id: '',
          recorded_by_user_id: appState.activeUserId,
          doctor_name: fd.get('doctorName'),
          examination_date: new Date().toISOString(),
          health_status: status,
          health_score: score,
          mobility_status: mobility,
          consciousness_level: 'ALERT',
          active_problems_diagnosis: diag,
          doctor_recommendations: rec
        };

        appState.clinicalAssessments.unshift(newAss);
        patient.current_health_score = score;
        patient.current_health_status = status;
        patient.current_mobility_status = mobility;
        patient.current_clinical_summary = rec;
        patient.last_examined_at = newAss.examination_date;

        recordAuditLog('RECORD_ASSESSMENT', 'clinical_assessments', newAss.id, `ثبت معاینه پزشک (${newAss.doctor_name}) و بروزرسانی امتیاز سلامت به ${score}`);
        saveAppState();
        dispatchBackendAction('createClinicalAssessment', newAss);
        closeModal();
        renderActiveView();
        showToast('نتیجه معاینه ثبت شد 🩺', 'کارت وضعیت بالینی بیمار در بالای داشبورد همگام‌سازی گردید.', 'success');
        return;
      }

      // ۵. فرم ثبت خرید و شارژ موجودی (Restock)
      if (form.id === 'formRestockItem') {
        const itemId = form.getAttribute('data-item-id');
        const fd = new FormData(form);
        const qty = Number(fd.get('purchasedQuantity'));
        const cost = Number(fd.get('totalCostAmount'));
        const fileName = fd.get('receiptFileName');
        const item = appState.inventoryItems.find(i => i.id === itemId);

        if (item) {
          item.current_stock_quantity = Number(item.current_stock_quantity || 0) + qty;
          item.stock_status = 'NEWLY_PURCHASED';
          item.last_purchased_at = new Date().toISOString();

          appState.procurementOrders.forEach(o => {
            if (o.inventory_item_id === itemId && o.status === 'PENDING_PURCHASE') {
              o.status = 'PURCHASED_AND_STOCKED';
              o.purchased_quantity = qty;
              o.total_cost_amount = cost;
            }
          });

          if (cost > 0) {
            appState.financialInvoices.unshift({
              id: 'fin-' + Date.now().toString(36),
              patient_id: appState.activePatientId,
              recorded_by_user_id: appState.activeUserId,
              paid_by_user_id: appState.activeUserId,
              expense_category: item.item_category === 'MEDICATION' ? 'MEDICATION' : 'MEDICAL_SUPPLIES',
              title: `خرید مجدد ${item.name} (${toPersianDigits(qty)} ${item.unit})`,
              amount: cost,
              currency: 'IRT',
              invoice_date: new Date().toISOString().slice(0, 10),
              receipt_file_storage_key: 'drive://' + fileName,
              receipt_file_name: fileName,
              insurance_claim_status: 'PENDING_SUBMISSION',
              reimbursed_amount: 0
            });
          }

          recordAuditLog('RESTOCK_INVENTORY', 'inventory_items', itemId, `خرید و شارژ موجودی «${item.name}» (+${qty}) و ثبت خودکار فاکتور مالی`);
          saveAppState();
          dispatchBackendAction('restockInventoryItem', { itemId: itemId, purchasedQuantity: qty, totalCostAmount: cost, receiptFileName: fileName });
          closeModal();
          renderActiveView();
          showToast('موجودی شارژ شد و فاکتور ثبت گردید ✅', `وضعیت «${item.name}» به تازه خریداری‌شده تغییر یافت.`, 'success');
        }
        return;
      }

      // ۶. فرم تغییر دوز دارو توسط پزشک در میانه دوره (سناریوی مرزی ۸.۲.۳)
      if (form.id === 'formChangeMedicationDose') {
        const itemId = form.getAttribute('data-item-id');
        const fd = new FormData(form);
        const newRate = Number(fd.get('dailyConsumptionRate'));
        const newSpec = fd.get('dosageOrSpec');
        const item = appState.inventoryItems.find(i => i.id === itemId);

        if (item) {
          item.daily_consumption_rate = newRate;
          item.dosage_or_spec = newSpec;
          const daysRem = Math.floor(Number(item.current_stock_quantity || 0) / Math.max(0.1, newRate));
          if (item.current_stock_quantity <= 0) {
            item.stock_status = 'OUT_OF_STOCK';
          } else if (daysRem <= Number(item.low_stock_threshold_days || 5)) {
            item.stock_status = 'LOW_STOCK';
            const hasOpen = appState.procurementOrders.some(o => o.inventory_item_id === itemId && o.status === 'PENDING_PURCHASE');
            if (!hasOpen) {
              appState.procurementOrders.unshift({
                id: 'prc-' + Date.now().toString(36),
                patient_id: appState.activePatientId,
                inventory_item_id: itemId,
                assigned_purchaser_user_id: item.designated_purchaser_user_id || 'user-admin',
                status: 'PENDING_PURCHASE',
                urgency: 'HIGH_LOW_STOCK',
                requested_quantity: newRate * 30,
                alert_sent_at: new Date().toISOString()
              });
            }
          }
          recordAuditLog('UPDATE_MEDICATION_DOSE', 'inventory_items', itemId, `تغییر دوز مصرفی «${item.name}» به روزی ${newRate} عدد (روزهای باقی‌مانده: ${daysRem} روز)`);
          saveAppState();
          closeModal();
          renderActiveView();
          showToast('دوز دارو بروزرسانی و موجودی بازمحاسبه شد', `با دوز جدید، موجودی برای ${toPersianDigits(daysRem)} روز کافی است.`, daysRem <= 5 ? 'warning' : 'success');
        }
        return;
      }

      // ۷. فرم تحویل شیفت دیجیتال
      if (form.id === 'formShiftHandover') {
        const shId = form.getAttribute('data-shift-id');
        const fd = new FormData(form);
        const sh = appState.careShifts.find(s => s.id === shId);
        if (sh) {
          sh.handover_checklist = {
            sleep: fd.get('sleep'),
            appetite: fd.get('appetite'),
            bowel: fd.get('bowel'),
            mood: fd.get('mood')
          };
          sh.handover_notes = `خواب: ${fd.get('sleep')} | اشتها: ${fd.get('appetite')} | روحیه: ${fd.get('mood')} — ${fd.get('handoverNotes')}`;
          recordAuditLog('SUBMIT_HANDOVER', 'care_shifts', shId, 'ثبت چک‌لیست تحویل شیفت دیجیتال برای ' + sh.shift_title);
          saveAppState();
          closeModal();
          renderActiveView();
          showToast('چک‌لیست تحویل شیفت ثبت شد 📋', 'گزارش شما برای فرد شیفت بعدی نمایش داده می‌شود.', 'success');
        }
        return;
      }

      // ۸. فرم اعلام معذوریت شیفت
      if (form.id === 'formLeaveRequest') {
        const shId = form.getAttribute('data-shift-id');
        const fd = new FormData(form);
        const sh = appState.careShifts.find(s => s.id === shId);
        if (sh) {
          sh.status = 'OPEN_NEEDS_REPLACEMENT';
          const newReq = {
            id: 'scr-' + Date.now().toString(36),
            patient_id: appState.activePatientId,
            request_type: 'ABSENCE_REPLACEMENT',
            source_shift_id: shId,
            requester_user_id: sh.assigned_user_id,
            target_shift_id: null,
            target_user_id: null,
            reason: fd.get('reason'),
            status: 'PENDING_APPROVAL',
            created_at: new Date().toISOString()
          };
          appState.shiftChangeRequests.unshift(newReq);
          pushNotification('SMS + Telegram', 'اعلام نیاز به جایگزین شیفت', `شیفت «${sh.shift_title}» به علت «${newReq.reason}» نیازمند داوطلب جایگزین است.`);
          recordAuditLog('REQUEST_LEAVE', 'shift_change_requests', newReq.id, 'اعلام معذوریت برای ' + sh.shift_title);
          saveAppState();
          closeModal();
          renderActiveView();
          showToast('درخواست جایگزین ثبت شد 📢', 'پیامک و اعلان تلگرام به کل اعضای خانواده ارسال گردید.', 'warning');
        }
        return;
      }

      // ۹. فرم پیشنهاد جابه‌جایی دوطرفه شیفت
      if (form.id === 'formMutualSwap') {
        const srcId = form.getAttribute('data-source-shift-id');
        const fd = new FormData(form);

    function handleConsumeMedication(itemId, status) {
      const item = appState.inventoryItems.find(i => i.id === itemId);
      if (!item) return;

      if (status === 'TAKEN') {
        // قانون ۸.۱.۳: عدم منفی شدن موجودی دارو
        item.current_stock_quantity = Math.max(0, Number(item.current_stock_quantity || 0) - 1);
      }

      const daysRem = Math.floor(Number(item.current_stock_quantity || 0) / Math.max(0.1, Number(item.daily_consumption_rate || 1)));
      if (item.current_stock_quantity <= 0) {
        item.stock_status = 'OUT_OF_STOCK';
      } else if (daysRem <= Number(item.low_stock_threshold_days || 5)) {
        item.stock_status = 'LOW_STOCK';
      } else if (daysRem >= Number(item.low_stock_threshold_days || 5) * 3) {
        item.stock_status = 'NEWLY_PURCHASED';
      } else {
        item.stock_status = 'IN_STOCK';
      }

      // صدور خودکار و Idempotent سفارش خرید در صورت ورود به LOW_STOCK یا OUT_OF_STOCK
      if (item.stock_status === 'LOW_STOCK' || item.stock_status === 'OUT_OF_STOCK') {
        const existingOpen = appState.procurementOrders.find(
          o => o.inventory_item_id === item.id && o.status === 'PENDING_PURCHASE'
        );
        if (!existingOpen) {
          const purchaser = getUserById(item.designated_purchaser_user_id);
          appState.procurementOrders.unshift({
            id: 'prc-' + Date.now().toString(36),
            patient_id: appState.activePatientId,
            inventory_item_id: item.id,
            assigned_purchaser_user_id: item.designated_purchaser_user_id || 'user-admin',
            status: 'PENDING_PURCHASE',
            urgency: item.stock_status === 'OUT_OF_STOCK' ? 'CRITICAL_OUT_OF_STOCK' : 'HIGH_LOW_STOCK',
            requested_quantity: Math.max(30, Number(item.daily_consumption_rate || 1) * 30),
            alert_sent_at: new Date().toISOString()
          });
          pushNotification('SMS + Telegram', `هشدار خرید فوری: ${item.name}`, `موجودی به ${toPersianDigits(daysRem)} روز آینده رسید. سفارش خرید برای ${purchaser.full_name} صادر شد.`);
        }
      }

      const logRec = {
        id: 'mcl-' + Date.now().toString(36),
        inventory_item_id: item.id,
        patient_id: appState.activePatientId,
        administered_by_user_id: appState.activeUserId,
        scheduled_for: 'نوبت فعلی',
        taken_at: new Date().toISOString(),
        status: status,
        quantity_used: status === 'TAKEN' ? 1 : 0,
        notes: ''
      };
      appState.medicationConsumptionLogs.unshift(logRec);
      recordAuditLog('CONSUME_MEDICATION', 'medication_consumption_logs', logRec.id, `ثبت دوز مصرفی «${item.name}» با وضعیت ${status} (موجودی: ${item.current_stock_quantity})`);
      saveAppState();
      dispatchBackendAction('consumeInventoryItem', { itemId: item.id, status: status, quantityUsed: 1 });
      renderActiveView();

      showToast(
        status === 'TAKEN' ? `دوز «${item.name}» ثبت شد ✅` : `وضعیت «${status}» ثبت شد`,
        `موجودی فعلی: ${toPersianDigits(item.current_stock_quantity)} ${item.unit} (${toPersianDigits(daysRem)} روز باقی‌مانده)`,
        item.stock_status === 'LOW_STOCK' || item.stock_status === 'OUT_OF_STOCK' ? 'warning' : 'success'
      );
    }

    function handleClaimShiftReplacement(requestId) {
      const req = appState.shiftChangeRequests.find(r => r.id === requestId);
      if (!req || req.status !== 'PENDING_APPROVAL') {
        showToast('خطای ۴۰۹ (Conflict)', 'این شیفت چند لحظه پیش توسط عضو دیگری پذیرفته شد.', 'error');
        return;
      }
      const shift = appState.careShifts.find(s => s.id === req.source_shift_id);
      const claimer = getActiveUser();
      req.status = 'ACCEPTED_AND_APPLIED';
      req.target_user_id = claimer.id;
      req.responded_at = new Date().toISOString();

      if (shift) {
        shift.assigned_user_id = claimer.id;
        shift.status = 'SCHEDULED';
      }

      recordAuditLog('CLAIM_SHIFT', 'care_shifts', req.source_shift_id, `پذیرش داوطلبانه جایگزینی شیفت توسط ${claimer.full_name}`);
      saveAppState();
      dispatchBackendAction('claimShiftReplacement', { requestId: requestId });
      renderActiveView();
      showToast('جایگزینی شیفت با موفقیت ثبت شد 🤝', `شیفت «${shift ? shift.shift_title : ''}» به‌صورت اتمیک به نام ${claimer.full_name} منتقل گردید.`, 'success');
    }

    function handleRespondMutualSwap(requestId, decision) {
      const req = appState.shiftChangeRequests.find(r => r.id === requestId);
      if (!req || req.status !== 'PENDING_APPROVAL') return;

      const s1 = appState.careShifts.find(s => s.id === req.source_shift_id);
      const s2 = appState.careShifts.find(s => s.id === req.target_shift_id);

      if (decision === 'REJECT') {
        req.status = 'REJECTED';
        if (s1) s1.status = 'SCHEDULED';
        saveAppState();
        renderActiveView();
        showToast('پیشنهاد جابه‌جایی رد شد', 'هر دو شیفت در وضعیت قبلی خود باقی ماندند.', 'info');
        return;
      }

      if (s1 && s2) {
        const tempUser = s1.assigned_user_id;
        s1.assigned_user_id = s2.assigned_user_id;
        s2.assigned_user_id = tempUser;
        s1.status = 'SCHEDULED';
        s2.status = 'SCHEDULED';
      }
      req.status = 'ACCEPTED_AND_APPLIED';
      req.responded_at = new Date().toISOString();

      recordAuditLog('ATOMIC_SHIFT_SWAP', 'care_shifts', req.id, 'جابه‌جایی اتمیک دوطرفه شیفت‌ها با توافق طرفین');
      saveAppState();
      dispatchBackendAction('respondMutualSwap', { requestId: requestId, decision: 'ACCEPT' });
      renderActiveView();
      showToast('جابه‌جایی اتمیک انجام شد ⇄', 'صاحبان هر دو شیفت در تقویم خانواده جابه‌جا شدند.', 'success');
    }

            } else {
              showToast('وضعیت شبکه: آنلاین 📶', 'ارتباط زنده برقرار است.', 'info');
            }
          } else {
            showToast('شبیه‌سازی قطعی اینترنت فعال شد 📴', 'اکنون هر علامت حیاتی یا دارویی ثبت کنید در localStorage ذخیره موقت می‌شود.', 'warning');
          }
